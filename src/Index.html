<!DOCTYPE html>
<!-- `data-tema-pref` é a PREFERÊNCIA gravada no servidor: '' (acompanha o sistema),
     'claro' ou 'escuro'. `data-tema` é o resultado concreto, e é só nele que o CSS
     encosta. Vem do servidor e não de uma chamada assíncrona porque o tema tem que
     estar decidido antes da primeira pintura — `google.script.run` só responde depois
     dela, e o efeito seria a tela piscar branca a cada carregamento. -->
<html lang="pt-br" data-tema-pref="<?!= temaSalvo() ?>">
<head>
<meta charset="utf-8">

<script>
/*
 * Resolve a preferência em claro/escuro, síncrono e antes do <body>.
 *
 * Existe para o CSS ter UM bloco de tema escuro em vez de dois: sem esta resolução, o
 * caso "acompanha o sistema" precisaria repetir a paleta inteira dentro de um
 * `@media (prefers-color-scheme: dark)`, e a segunda cópia sairia de sincronia.
 */
(function () {
  var raiz = document.documentElement;
  var consulta = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');

  function aplicar() {
    var pref = raiz.getAttribute('data-tema-pref') || '';
    var escuro = pref ? pref === 'escuro' : !!(consulta && consulta.matches);
    raiz.setAttribute('data-tema', escuro ? 'escuro' : 'claro');
    /* Na primeira execução o botão ainda não existe — este script roda antes do <body>.
       A guarda serve para a reação ao sistema, que acontece com a tela já montada. */
    if (window.pintarBotaoTema) window.pintarBotaoTema();
  }
  aplicar();

  /* Só reage ao sistema enquanto não houver escolha explícita — o `aplicar` relê a
     preferência, então trocar o tema à mão desliga esta reação sem mais nenhum estado. */
  if (consulta && consulta.addEventListener) consulta.addEventListener('change', aplicar);
})();
</script>

<style>
/* ==========================================================================
   TOKENS — base do model-app (indigo sobre cinza, radius 12, sombra discreta),
   com as cores de estado dos painéis do Notion, que já são o vocabulário dele.

   NENHUMA cor literal fora deste bloco. É a condição que faz o tema escuro ser
   uma troca de valores em vez de uma varredura pelo arquivo, e é a regra que
   quebra primeiro quando alguém acrescenta um `#hex` no meio de uma regra.
   ========================================================================== */
:root {
  --primary: #6366f1; --primary-dark: #4f46e5; --primary-soft: #eef2ff;
  --bg: #f8f9fa; --surface: #ffffff; --border: #e5e7eb; --border-forte: #d1d5db;
  --text: #1f2937; --muted: #6b7280; --sutil: #9ca3af;
  --ok: #059669; --warn: #d97706; --bad: #dc2626;

  /* Texto/ícone que fica SOBRE cor saturada (badge, botão primário, marca do agora).
     Existe porque no claro é branco e no escuro precisa ser escuro: as cores de estado
     clareiam no tema escuro, e branco sobre `#f87171` não passa de contraste. */
  --sobre-cor: #ffffff;

  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  --shadow-md: 0 4px 12px rgba(16,24,40,.10), 0 2px 4px rgba(16,24,40,.06);
  --shadow-modal: 0 20px 50px rgba(16,24,40,.22);
  --overlay: rgba(17,24,39,.42);

  --s-not-started: #6b7280; --s-not-started-bg: #f3f4f6;
  --s-in-progress: #3b6591; --s-in-progress-bg: #e8f0fa;
  --s-done: #1e8449;        --s-done-bg: #e9f7ee;
  --s-delegado: #a8622d;    --s-delegado-bg: #fbe9dc;
  --s-sem: #9ca3af;         --s-sem-bg: #f3f4f6;

  --p-alta: #c0392b;  --p-alta-bg: #fdecec;
  --p-media: #a86a00; --p-media-bg: #fef6e0;
  --p-baixa: #1e8449; --p-baixa-bg: #e9f7ee;

  --marca-2: #8b5cf6;                                  /* fim do gradiente da marca */
  --veredito-bg2: #f5f3ff; --veredito-borda: #ddd6fe;   /* o cartão de veredito do Hoje */
  --vao-a: #f0fdf4; --vao-b: #ecfdf5;                   /* hachura do vão da agenda */
  --vao-borda: #86efac; --vao-txt: #15803d;
  --espera-a: #e5e7eb; --espera-b: #f3f4f6;             /* hachura do trecho de espera do Gantt */
  --erro-bg: #fef2f2; --erro-borda: #fecaca; --erro-txt: #991b1b;

  /* Só os componentes, sem `rgb()`: o mapa de calor das anotações monta a cor no JS com
     alfa variável, e `rgba(var(--heat-rgb), .4)` é a única forma de um token participar
     disso. Trocar por um hex aqui reintroduz a cor literal no JS. */
  --heat-rgb: 99,102,241;

  --lateral: 216px;
}

/* ==========================================================================
   TEMA ESCURO — um bloco só, e por isso o `auto` é resolvido antes do CSS.

   O seletor é `[data-tema="escuro"]` e nada mais: quem decide entre claro e escuro
   quando a preferência é "acompanhar o sistema" é o script do <head>, que grava o
   valor concreto no <html> antes da primeira pintura. A alternativa — repetir estes
   valores dentro de um `@media (prefers-color-scheme: dark)` — significaria duas
   cópias da paleta, e a segunda sai de sincronia no primeiro ajuste.

   Cinza-azulado, não preto: a tela se apoia em superfícies empilhadas (lateral sobre
   fundo, card sobre fundo), e sobre preto puro a sombra desaparece e a pilha achata.
   A relação se mantém invertida igual ao claro — `--surface` mais claro que `--bg`.
   ========================================================================== */
:root[data-tema="escuro"] {
  --primary: #818cf8; --primary-dark: #a5b4fc; --primary-soft: #1f2138;
  --bg: #0f1115; --surface: #171a21; --border: #262b36; --border-forte: #39414f;
  --text: #e6e8ec; --muted: #9aa3b2; --sutil: #6f7787;
  --ok: #34d399; --warn: #fbbf24; --bad: #f87171;

  --sobre-cor: #14161c;

  --shadow: 0 1px 3px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.34);
  --shadow-md: 0 4px 14px rgba(0,0,0,.52), 0 2px 6px rgba(0,0,0,.36);
  --shadow-modal: 0 20px 50px rgba(0,0,0,.62);
  --overlay: rgba(3,5,9,.66);

  --s-not-started: #9aa3b2; --s-not-started-bg: #21252e;
  --s-in-progress: #7fb0e8; --s-in-progress-bg: #16222f;
  --s-done: #4ecb8a;        --s-done-bg: #12241a;
  --s-delegado: #e0a06a;    --s-delegado-bg: #2a1e14;
  --s-sem: #6f7787;         --s-sem-bg: #1c1f27;

  --p-alta: #f28b82;  --p-alta-bg: #2b1616;
  --p-media: #e8c168; --p-media-bg: #2a2110;
  --p-baixa: #6ed49b; --p-baixa-bg: #13251b;

  --marca-2: #a78bfa;
  --veredito-bg2: #241f3d; --veredito-borda: #3b3566;
  --vao-a: #10241a; --vao-b: #0e1f17;
  --vao-borda: #2f6b48; --vao-txt: #6ed49b;
  --espera-a: #262b36; --espera-b: #1c2027;
  --erro-bg: #2a1416; --erro-borda: #4d2226; --erro-txt: #f0a1a1;

  --heat-rgb: 129,140,248;
}

* { box-sizing: border-box; }

body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }

/* ============================ SHELL ====================================== */
.app { display: flex; min-height: 100vh; }

.lateral {
  width: var(--lateral); flex: none; background: var(--surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; transition: width .16s ease;
}
.app.compacta .lateral { width: 58px; }

.lateral-topo { display: flex; align-items: center; gap: 9px; padding: 14px 14px 10px; }
.marca-ponto {
  width: 24px; height: 24px; border-radius: 7px; flex: none;
  background: linear-gradient(135deg, var(--primary) 0%, var(--marca-2) 100%);
}
.marca-nome { font-weight: 650; letter-spacing: -.01em; }
.recolher {
  margin-left: auto; border: 0; background: transparent; color: var(--sutil);
  cursor: pointer; padding: 3px 6px; border-radius: 6px; line-height: 1; font-size: 15px;
}
.recolher:hover { background: var(--bg); color: var(--text); }

.menu { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  border: 0; background: transparent; cursor: pointer; color: var(--muted);
  padding: 8px 10px; border-radius: 9px; font-weight: 550; font-size: 13.5px; text-align: left;
  transition: background .12s, color .12s;
}
.menu-item:hover { background: var(--bg); color: var(--text); }
.menu-item.ativa { background: var(--primary-soft); color: var(--primary-dark); }
.menu-ico { width: 18px; text-align: center; flex: none; font-size: 15px; }
.menu-sino {
  margin-left: auto; font-size: 11px; font-weight: 700; background: var(--bad); color: var(--sobre-cor);
  border-radius: 20px; padding: 0 6px; min-width: 18px; text-align: center;
}
.lateral-pe { margin-top: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

/* O botão de recolher NUNCA some — ele é o único caminho de volta. Escondê-lo no modo
   compacto deixava a lateral fechada para sempre. */
.app.compacta .marca-nome,
.app.compacta .menu-item span:not(.menu-ico):not(.menu-sino),
.app.compacta .lateral-pe .btn span { display: none; }
/* Exceção ao de cima: ícone de botão do pé sobrevive ao recolhimento. Sem isto o botão
   de tema viraria um retângulo vazio — o mesmo estado em que Sincronizar e Recarregar
   já ficam hoje, e que só o `title` salva. */
.app.compacta .lateral-pe .btn .btn-ico { display: inline; }
.app.compacta .menu-item { justify-content: center; padding: 9px 0; }
.app.compacta .lateral-topo { flex-direction: column; gap: 6px; padding: 14px 0 10px; }
.app.compacta .recolher { margin: 0; }

.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topo {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 22px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.topo h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.topo .sub { color: var(--sutil); font-size: 12.5px; }
.espaco { flex: 1; }

.busca { position: relative; }
.busca input {
  width: 230px; padding: 7px 30px 7px 32px; border: 1px solid var(--border);
  border-radius: 9px; background: var(--bg); outline: none; transition: border-color .12s, background .12s;
}
.busca input:focus { border-color: var(--primary); background: var(--surface); }
.busca .lupa { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--sutil); pointer-events: none; }
.busca .limpar {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--sutil); cursor: pointer;
  padding: 2px 5px; border-radius: 5px; line-height: 1; display: none;
}
.busca.tem-texto .limpar { display: block; }
.busca .limpar:hover { background: var(--border); color: var(--text); }

.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 7px 13px; border-radius: 9px; cursor: pointer; font-weight: 550; font-size: 13px;
  transition: background .12s, border-color .12s; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--bg); border-color: var(--border-forte); }
.btn:disabled { opacity: .55; cursor: default; }
.btn .btn-ico { margin-right: 6px; font-size: 14px; line-height: 1; }
.app.compacta .lateral-pe .btn .btn-ico { margin-right: 0; }
.btn-primario { background: var(--primary); border-color: var(--primary); color: var(--sobre-cor); }
.btn-primario:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }

/* ============================ AVISOS ===================================== */
.faixa { margin: 12px 22px 0; }
.faixa:empty { display: none; }
.aviso, .erro {
  border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm);
  padding: 10px 14px; box-shadow: var(--shadow);
}
.aviso { border-left: 3px solid var(--warn); }
.aviso.ok { border-left-color: var(--ok); }
.erro { border-left: 3px solid var(--bad); }
.erro b { display: block; margin-bottom: 3px; }
.erro code {
  display: block; margin-top: 7px; font-size: 12px; color: var(--muted);
  background: var(--bg); padding: 7px 9px; border-radius: 6px; word-break: break-word;
}
.carregando { color: var(--muted); padding: 46px 22px; text-align: center; }

.pagina { padding: 18px 22px 44px; }
.secao-titulo {
  font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em;
  color: var(--sutil); margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
}
.secao-num {
  background: var(--bg); color: var(--muted); border-radius: 20px; padding: 0 7px;
  font-size: 11px; letter-spacing: 0;
}
.secao + .secao { margin-top: 24px; }
.vazio-msg { color: var(--sutil); font-size: 13px; margin: 0; padding: 4px 0; }
.painel {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}

/* ============================ HOJE ======================================= */
/* Uma coluna só, de cima para baixo, na ordem da urgência. A versão de duas colunas
   criava duas ordens de leitura paralelas: o olho não sabia por onde começar nem como
   os dois lados se relacionavam. Aqui existe um caminho, e ele é vertical. */
.hoje { max-width: 900px; }
.hoje-cab { margin-bottom: 20px; }
.hoje-cab .dia { font-size: 12.5px; color: var(--sutil); text-transform: uppercase; letter-spacing: .05em; }
/* O veredito é a coisa mais alta da tela de propósito: ele responde "por onde começo"
   antes de qualquer lista, que é a pergunta que traz alguém aqui às nove da manhã. */
.veredito { font-size: 25px; font-weight: 650; letter-spacing: -.025em; margin: 3px 0 0; }
.veredito.urgente { color: var(--bad); }
.veredito.calmo { color: var(--ok); }
.veredito-obs { color: var(--muted); font-size: 13.5px; margin-top: 3px; }

/* Cada bloco de prazo tem uma cor de urgência na aresta. É o que substitui a divisão
   em colunas: a hierarquia passou a ser vertical e cromática, não espacial. */
.bloco { margin-bottom: 20px; }
.bloco-cab {
  display: flex; align-items: center; gap: 9px; margin: 0 0 8px;
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
}
.bloco-cab .n {
  font-size: 11px; font-weight: 700; border-radius: 20px; padding: 0 7px;
  background: currentColor; color: var(--sobre-cor); letter-spacing: 0;
}
.bloco-cab .n span { filter: none; }
.bloco.b-vencido .bloco-cab { color: var(--bad); }
.bloco.b-hoje .bloco-cab { color: var(--primary-dark); }
.bloco.b-amanha .bloco-cab { color: var(--muted); }
/* O bloco de andamento veste a cor do STATUS, e não uma quarta cor de urgência: ele é o
   único que não se define por prazo, e a aresta é o que diz isso antes de o título ser
   lido. É o mesmo token do chip `st-in-progress` das linhas lá dentro. */
.bloco.b-andamento .bloco-cab { color: var(--s-in-progress); }
.bloco .painel { border-left: 3px solid currentColor; }
.bloco.b-vencido .painel { border-left-color: var(--bad); }
.bloco.b-hoje .painel { border-left-color: var(--primary); }
.bloco.b-amanha .painel { border-left-color: var(--border-forte); }
.bloco.b-andamento .painel { border-left-color: var(--s-in-progress); }

.linhas { display: flex; flex-direction: column; }
/* O "mostrar mais" é a ÚLTIMA LINHA do painel, não um botão solto embaixo dele: o que ele
   revela são linhas daquela lista, e sair da caixa faria parecer que abre outra coisa.

   Sem borda própria: estando dentro de `.linhas`, ele deixa de ser o `:last-child` das
   linhas, e a `border-bottom` da última já é o traço que o separa. Uma `border-top` aqui
   somaria com aquela e desenharia 2px só nesse ponto do painel. */
.bloco-mais {
  display: block; width: 100%; text-align: left; padding: 10px 14px;
  background: none; border: 0;
  color: var(--muted); font-size: 13px; cursor: pointer; transition: background .1s;
}
.bloco-mais:hover { background: var(--bg); color: var(--text); }
.linha {
  display: flex; align-items: center; gap: 9px; padding: 10px 14px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s;
}
.linha:last-child { border-bottom: 0; }
.linha:hover { background: var(--bg); }
.linha .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* "De olho": o que se monitora, não o que se executa. Fica embaixo e em cartão menor
   justamente para não competir com a fila do dia. */
.de-olho { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.olho {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 13px 15px;
}
.olho h3 {
  margin: 0 0 9px; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--sutil); display: flex; align-items: center; gap: 7px;
}
.olho-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px;
  border-bottom: 1px solid var(--border); cursor: pointer;
}
.olho-item:last-child { border-bottom: 0; }
.olho-item:hover .olho-txt { color: var(--primary-dark); }
.olho-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.olho .vazio-msg { padding: 0; }
.badge, .status {
  font-size: 11px; font-weight: 600; padding: 1.5px 7px; border-radius: 5px; white-space: nowrap; flex: none;
}
.st-not-started { background: var(--s-not-started-bg); color: var(--s-not-started); }
.st-in-progress { background: var(--s-in-progress-bg); color: var(--s-in-progress); }
.st-done        { background: var(--s-done-bg);        color: var(--s-done); }
.st-delegado    { background: var(--s-delegado-bg);    color: var(--s-delegado); }
.st-sem-status  { background: var(--s-sem-bg);         color: var(--s-sem); }
.chip-pessoa {
  font-size: 11px; color: var(--muted); background: var(--bg);
  padding: 1.5px 7px; border-radius: 5px; white-space: nowrap; flex: none;
}
.dias-fora { font-size: 11px; color: var(--bad); font-weight: 600; flex: none; }

.um-a-um {
  background: linear-gradient(135deg, var(--primary-soft) 0%, var(--veredito-bg2) 100%);
  border: 1px solid var(--veredito-borda); border-radius: var(--radius); padding: 14px 16px;
}
.um-a-um .quem { font-size: 16px; font-weight: 650; margin: 3px 0; }
.um-a-um .obs { font-size: 12.5px; color: var(--muted); }

/* ============================ BOARD ====================================== */
.board { display: flex; gap: 14px; align-items: flex-start; padding: 18px 22px 44px; overflow-x: auto; }
.coluna {
  flex: 1 1 0; min-width: 246px; max-width: 340px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  transition: border-color .12s, background .12s;
}
.coluna-cab {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 13px; border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none;
}
.coluna-cab:hover .coluna-nome { color: var(--primary); }
.ponto { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.s-not-started { background: var(--s-not-started); }
.s-in-progress { background: var(--s-in-progress); }
.s-done        { background: var(--s-done); }
.s-delegado    { background: var(--s-delegado); }
.s-sem-status  { background: var(--s-sem); }
.coluna-nome { font-weight: 600; font-size: 13px; transition: color .12s; }
.coluna-num {
  margin-left: auto; font-size: 12px; color: var(--muted);
  background: var(--bg); padding: 1px 8px; border-radius: 20px; font-variant-numeric: tabular-nums;
}
.coluna-ocultos { font-size: 11px; color: var(--sutil); }
.coluna-corpo { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.coluna-vazia { color: var(--sutil); font-size: 12.5px; text-align: center; padding: 14px 0; margin: 0; }
.coluna-opcoes {
  display: flex; align-items: center; gap: 7px; padding: 8px 13px;
  border-bottom: 1px solid var(--border); background: var(--bg);
  font-size: 12px; color: var(--muted);
}
.coluna-opcoes label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

/* Colapsada vira um trilho estreito: devolve a largura para as colunas em movimento,
   que é o ponto — Done é histórico, e histórico não merece um quinto da tela. */
.coluna.colapsada { flex: 0 0 46px; min-width: 46px; max-width: 46px; }
.coluna.colapsada .coluna-cab {
  flex-direction: column; gap: 10px; border-bottom: 0; padding: 12px 0; height: 100%;
}
.coluna.colapsada .coluna-nome { writing-mode: vertical-rl; text-orientation: mixed; }
.coluna.colapsada .coluna-num { margin: 0; }
.coluna.colapsada .coluna-corpo,
.coluna.colapsada .coluna-opcoes { display: none; }

.tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 11px; cursor: pointer; position: relative;
  transition: box-shadow .12s, border-color .12s;
}
.tile:hover { box-shadow: var(--shadow-md); border-color: var(--border-forte); }
.tile:active { cursor: grabbing; }
.tile.arrastando { opacity: .4; }
/* Vencido: acento na borda esquerda em vez de badge. A informação aparece na
   varredura vertical sem competir com prioridade e prazo pela linha de meta. */
.tile.vencido { border-left: 3px solid var(--bad); }
.tile-titulo { font-weight: 550; margin-bottom: 7px; word-break: break-word; }
.tile-titulo.vazio { color: var(--sutil); font-style: italic; font-weight: 400; }
.tile-linha { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 600; padding: 1.5px 7px; border-radius: 5px; white-space: nowrap; }
.p-alta  { background: var(--p-alta-bg);  color: var(--p-alta); }
.p-media { background: var(--p-media-bg); color: var(--p-media); }
.p-baixa { background: var(--p-baixa-bg); color: var(--p-baixa); }
.pill.aguardando { background: var(--primary-soft); color: var(--primary-dark); }
.prazo { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prazo.atrasado { color: var(--bad); font-weight: 600; }
.delegado {
  margin-top: 7px; font-size: 11.5px; color: var(--s-delegado);
  background: var(--s-delegado-bg); padding: 2px 7px; border-radius: 5px; display: inline-block;
}
.coluna.alvo { border-color: var(--primary); background: var(--primary-soft); }
.coluna.alvo .coluna-corpo::after {
  content: ''; display: block; height: 46px; border: 2px dashed var(--primary);
  border-radius: var(--radius-sm); opacity: .5;
}

/* ============================ DASHBOARD ================================== */
.cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }
.cartao {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 15px; box-shadow: var(--shadow);
}
.cartao-num { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cartao-rot { font-size: 12px; color: var(--muted); margin-top: 1px; }
.cartao.alerta .cartao-num { color: var(--bad); }

.matriz { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.matriz th, .matriz td { padding: 9px 12px; text-align: center; border-bottom: 1px solid var(--border); }
.matriz thead th { font-size: 11.5px; font-weight: 600; color: var(--muted); text-align: center; }
.matriz tbody th { text-align: left; font-weight: 600; font-size: 13px; }
.matriz tr:last-child td, .matriz tr:last-child th { border-bottom: 0; }
.matriz .total { color: var(--muted); font-weight: 600; background: var(--bg); }
.matriz .zero { color: var(--sutil); }
/* Intensidade proporcional: a leitura que interessa é "onde a massa está", e cor faz
   isso mais rápido que número. O número continua lá para quem precisa do exato. */
.matriz .celula { font-weight: 600; border-radius: 6px; }

/* ============================ AGENDA DO DIA ============================== */
/* Duas colunas na Hoje. A da direita é outro eixo — tempo, não prioridade —, e é por isso
   que ela não recria as "duas ordens de leitura paralelas" que a versão anterior tinha.
   Ver `04`. */
/**
 * Ocupa a largura disponível: a fila cresce, e a agenda cresce até um limite.
 *
 * Duas correções moram aqui. A primeira: `.hoje` tem `max-width: 900px`, e deixar isso
 * valer para a grade fazia a agenda tirar espaço da fila em vez de preencher o vazio à
 * direita. A segunda: cravar 900 + 340 resolvia a proporção mas deixava o resto da tela em
 * branco.
 *
 * A agenda tem teto porque ela é uma linha do tempo — passados ~420px o gráfico só fica
 * mais largo, sem dizer mais nada. Quem absorve a sobra é a fila.
 *
 * O teto geral de 1900px é só sanidade de monitor ultrawide: a partir dali a linha do card
 * fica com um vão enorme entre o título e os badges.
 */
.hoje-duas {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
  gap: 24px; align-items: start; max-width: 1900px;
}
.hoje-fila { min-width: 0; }
/* Sem `sticky`: com a escala vertical atual a coluna passa da altura da janela, e fixá-la
   no topo esconderia o fim do dia — que é justamente o que se quer ver às 17h. */
.hoje-agenda { min-width: 0; }

.ag-cab { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.ag-cab .secao-titulo { margin: 0; }

.ag-caixa {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.ag-dia-inteiro { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.ag-dia-inteiro span {
  font-size: 11.5px; font-weight: 500; color: var(--primary-dark);
  background: var(--primary-soft); padding: 5px 10px; border-radius: 7px;
}
.ag-rodape { font-size: 11.5px; color: var(--sutil); margin: 9px 2px 0; }

/* --- o alerta do próximo, acima da linha do tempo --- */
/* Compacto de propósito: é companheiro da linha do tempo, não o produto da coluna. */
.ag-foco {
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--primary);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 13px; margin-bottom: 8px;
}
.ag-foco.agora { border-left-color: var(--bad); }
.ag-foco.fim { border-left-color: var(--ok); }
.ag-foco-quem { font-size: 14px; font-weight: 600; line-height: 1.3; margin: 1px 0; }
.ag-foco-obs { font-size: 10.5px; color: var(--muted); }

/* --- a linha do tempo --- */
.ag-tempo { position: relative; margin: 10px 12px 12px 40px; }
.ag-hora-marca { position: absolute; left: -40px; right: 0; border-top: 1px dashed var(--border); }
.ag-hora-marca span {
  position: absolute; left: 0; top: -7px; font-size: 10px; color: var(--sutil);
  font-variant-numeric: tabular-nums; background: var(--surface); padding-right: 4px;
}
/* O vão é o produto deste formato: é ele que responde "onde o trabalho cabe". */
.ag-vao {
  position: absolute; left: 0; right: 0; border-radius: 6px;
  background: repeating-linear-gradient(135deg, var(--vao-a) 0 6px, var(--vao-b) 6px 12px);
  border: 1px dashed var(--vao-borda); display: flex; align-items: center; justify-content: center;
}
.ag-vao span { font-size: 10px; font-weight: 600; color: var(--vao-txt); }
.ag-bloco {
  position: absolute; border-radius: 7px; padding: 4px 7px; overflow: hidden;
  background: var(--primary-soft); border-left: 3px solid var(--primary);
  display: flex; flex-direction: column; gap: 1px;
}
.ag-bloco.passou { background: var(--bg); border-left-color: var(--border); opacity: .6; }
.ag-bloco b {
  font-size: 11px; font-weight: 600; color: var(--primary-dark); line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ag-bloco.passou b { color: var(--muted); }
.ag-bloco span { font-size: 9.5px; color: var(--sutil); font-variant-numeric: tabular-nums; }
.ag-agora { position: absolute; left: -40px; right: 0; height: 2px; background: var(--bad); z-index: 3; }
.ag-agora b {
  position: absolute; left: -2px; top: -8px; font-size: 9px; color: var(--sobre-cor);
  background: var(--bad); padding: 1px 4px; border-radius: 4px; font-weight: 600;
}

/* ============================ GANTT ====================================== */
.gantt { display: flex; overflow-x: auto; }
.gt-nomes { flex: none; width: 250px; border-right: 1px solid var(--border); background: var(--surface); }
.gt-tempo { flex: 1; min-width: 0; overflow-x: auto; }
.gt-canvas { position: relative; }
.gt-eixo { display: flex; height: 30px; border-bottom: 1px solid var(--border); }
.gt-eixo div {
  flex: none; font-size: 10.5px; color: var(--sutil); padding: 8px 0 0 5px;
  border-left: 1px solid var(--border); white-space: nowrap;
}
.gt-espaco { height: 30px; border-bottom: 1px solid var(--border); }
.gt-nome {
  height: 32px; display: flex; align-items: center; padding: 0 12px;
  border-bottom: 1px solid var(--border); font-size: 12.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
}
.gt-nome:hover { background: var(--bg); }
.gt-faixa { height: 32px; position: relative; border-bottom: 1px solid var(--border); }
.gt-nomes > :last-child, .gt-corpo > :last-child { border-bottom: 0; }
.gt-corpo { position: relative; }
.gt-grade { position: absolute; inset: 0; pointer-events: none; }
.gt-hoje { position: absolute; top: 30px; bottom: 0; width: 2px; background: var(--bad); z-index: 2; }
.gt-hoje b {
  position: absolute; top: -22px; left: -16px; font-size: 10px; color: var(--sobre-cor);
  background: var(--bad); padding: 1px 5px; border-radius: 4px; font-weight: 600;
}
.gt-bar { position: absolute; top: 8px; height: 16px; border-radius: 5px; display: flex; overflow: hidden; }
/* Dois segmentos: o tempo esperando e o tempo em execução. Sem isso o Gantt mostraria
   4 dos 20 ativos — `data_inicio` só é carimbada ao entrar em In progress. */
.gt-espera { background: repeating-linear-gradient(135deg, var(--espera-a) 0 5px, var(--espera-b) 5px 10px); }
.gt-exec-in-progress { background: var(--s-in-progress); }
.gt-exec-delegado    { background: var(--s-delegado); }
.gt-exec-not-started { background: var(--s-not-started); }
.gt-exec-sem-status  { background: var(--s-sem); }
.gt-bar.atrasada { box-shadow: 0 0 0 2px var(--bad); }
.gt-legenda { display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--muted); }
.gt-legenda i { width: 14px; height: 9px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 5px; }
/* Dois grupos de naturezas diferentes, separados por uma barra vertical: o primeiro filtra,
   o segundo só explica a cor. Misturá-los é o que fazia "clicar em esperando" não querer
   dizer nada. Ver `04`. */
.gt-legenda .grupo { display: flex; gap: 12px; align-items: center; }
.gt-legenda .grupo + .grupo { padding-left: 14px; border-left: 1px solid var(--border); }
.gt-legenda button {
  font: inherit; color: inherit; background: none; border: 0; padding: 2px 4px;
  border-radius: 5px; cursor: pointer; display: flex; align-items: center;
}
.gt-legenda button:hover { background: var(--bg); }
.gt-legenda button.off { opacity: .38; text-decoration: line-through; }
/* A régua é a área de arraste. O cursor diz isso antes do title. */
.gt-eixo { cursor: ew-resize; user-select: none; }
.gt-selecao {
  position: absolute; top: 0; height: 30px; z-index: 3; pointer-events: none;
  background: var(--primary-soft); border-left: 1px solid var(--primary);
  border-right: 1px solid var(--primary);
}
.gt-recorte {
  display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px;
  color: var(--primary-dark); background: var(--primary-soft);
  padding: 3px 9px; border-radius: 20px; font-weight: 500;
}
.gt-recorte button {
  font: inherit; font-weight: 600; color: inherit; background: none;
  border: 0; padding: 0; cursor: pointer; text-decoration: underline;
}

/* ============================ ANOTAÇÕES ================================== */
.pessoas-lista {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.pessoa-linha {
  display: grid; grid-template-columns: 190px 96px 1fr 116px; gap: 14px;
  align-items: center; padding: 11px 15px; border-bottom: 1px solid var(--border);
}
/* Resumos usa a mesma linha com quatro células. A coluna do total é só de Anotações —
   sem o modificador, o botão "Ler" cairia na coluna estreita do número. */
.pessoa-linha.com-total { grid-template-columns: 190px 96px 1fr 64px 116px; }
/* O total ganha coluna própria porque era a única informação da linha que exigia somar
   de cabeça. Mesmo vocabulário dos cartões do topo: número grande, rótulo pequeno. */
.total-notas { text-align: right; font-variant-numeric: tabular-nums; }
.total-notas b { font-size: 17px; font-weight: 650; display: block; line-height: 1.1; }
.total-notas span { font-size: 10.5px; color: var(--sutil); }
.total-notas.vazio-total b { color: var(--sutil); font-weight: 500; }
.pessoa-linha:last-child { border-bottom: 0; }
.pessoa-nome { font-weight: 550; }
.pessoa-nivel { font-size: 11px; color: var(--muted); }
.silencio { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.silencio.frio { color: var(--ok); }
.silencio.morno { color: var(--warn); }
.silencio.quente, .silencio.nunca { color: var(--bad); }
.barra { display: flex; height: 8px; border-radius: 20px; overflow: hidden; background: var(--bg); }
.barra span { display: block; }
.barra .b-pos { background: var(--ok); }
.barra .b-mel { background: var(--warn); }
.contagens { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
/* O que o filtro de inativos tirou da vista, dito em voz baixa mas dito. Mesmo princípio
   do cabeçalho da coluna Done: esconder em silêncio é como a tela perde a confiança. */
.ocultos { font-weight: 400; color: var(--sutil); text-transform: none; letter-spacing: 0; }
.c-pos { color: var(--ok); font-weight: 600; }
.c-mel { color: var(--warn); font-weight: 600; }

.filtros { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filtros select {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); outline: none;
}
.filtros select:focus { border-color: var(--primary); }
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  padding: 5px 11px; border-radius: 20px; cursor: pointer; font-size: 12.5px; font-weight: 550;
  transition: all .12s;
}
.chip:hover { border-color: var(--border-forte); color: var(--text); }
.chip.ativo { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark); }

/* ====================== ANOTAÇÕES — a lista ==============================
 * Três faixas fixas, no espírito da fila do Hoje: à esquerda **quem e que sinal
 * é**, no meio **o que foi observado e a evidência**, à direita **quando e sob
 * quais valores**. O ganho é varrer trinta anotações na vertical sem reler a
 * estrutura de cada uma — cada informação sempre na mesma coluna.
 *
 * O prefixo `anot-` é obrigatório, e é conserto de um bug real: estas regras se
 * chamavam `.nota*`, e a aba Notas — recado solto, outra entidade — trouxe um
 * segundo `.nota` e um segundo `.nota-texto`. A definição de baixo vencia, e o
 * cartão de anotação passava a ser a grade de DUAS colunas da outra tela: o
 * texto do feedback caía na coluna da direita, a da esquerda colapsava para
 * zero, o nome ficava por cima do texto e a evidência saía uma letra por linha.
 * `Anotações` e `Notas` agora têm prefixos distintos porque são entidades
 * distintas.
 *
 * `grid-template-areas` e não posicionamento automático: com célula nomeada,
 * cada filho declara onde mora, e a armadilha que causou o bug — item com
 * `grid-row` definido é colocado ANTES dos automáticos e rouba a coluna errada
 * — deixa de ser possível. A reflow estreita também vira uma linha só.
 * ======================================================================== */
.anots { display: flex; flex-direction: column; gap: 9px; }
.anot {
  display: grid;
  /* 168px na faixa da direita é medida, não estética: é o que faz DOIS chips de valor
     caberem lado a lado. Com 140px, "Colaboração" e "Transparência" empilhavam um por
     linha e esticavam o cartão ao dobro da altura do seu conteúdo. Dois é o teto real —
     a skill grava um valor por padrão. */
  grid-template-columns: 118px minmax(0, 1fr) 168px;
  grid-template-areas:
    "quem nota data"
    "tipo evid valores";
  gap: 5px 16px; align-items: start;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 15px; box-shadow: var(--shadow);
}
.anot-quem { grid-area: quem; font-weight: 600; font-size: 13px; word-break: break-word; }
.anot-tipo { grid-area: tipo; }
.t-positivo { background: var(--p-baixa-bg); color: var(--p-baixa); }
.t-melhoria { background: var(--p-media-bg); color: var(--p-media); }
/* A observação é o juízo, e é o que se lê primeiro: fica no tamanho do corpo. */
.anot-nota { grid-area: nota; word-break: break-word; }
/* A evidência é o caso concreto que sustenta o juízo — subordinada a ele, e a barra
   à esquerda é o que diz isso sem precisar de rótulo. */
.anot-evid {
  grid-area: evid; font-size: 12.5px; color: var(--muted);
  border-left: 2px solid var(--border); padding-left: 9px; word-break: break-word;
}
.anot-data {
  grid-area: data; font-size: 11.5px; color: var(--sutil);
  text-align: right; font-variant-numeric: tabular-nums;
}
.anot-valores {
  grid-area: valores; display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end;
}
.anot-valor {
  font-size: 10.5px; font-weight: 600; padding: 1.5px 7px; border-radius: 5px;
  background: var(--primary-soft); color: var(--primary-dark);
}

/* ============================ LEITURA ==================================== */
/* O compilado é prosa longa e densa, lida antes de entrar numa conversa. Ele merece a
   tela inteira e nada em volta — mas com a linha curta, porque texto corrido de ponta a
   ponta do monitor é ilegível. Superfície cheia, medida confortável. */
.leitura {
  display: none; position: fixed; inset: 0; z-index: 60;
  background: var(--surface); overflow-y: auto;
}
.leitura.aberto { display: block; }
.leitura-topo {
  position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 12px 22px; z-index: 1;
}
.leitura-quem { font-weight: 650; }
.leitura-data { color: var(--sutil); font-size: 13px; font-variant-numeric: tabular-nums; }
.leitura-corpo {
  max-width: 68ch; margin: 0 auto; padding: 40px 24px 80px;
  font-size: 16px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}

/* ============================ MODAL ====================================== */
.overlay {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: var(--overlay); padding: 24px; overflow-y: auto;
}
.overlay.aberto { display: flex; align-items: flex-start; justify-content: center; }
.modal {
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-modal);
  width: 100%; max-width: 560px; margin: auto;
}
.modal.estreito { max-width: 380px; }
.modal-cab { display: flex; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--border); }
.modal-cab h2 { margin: 0; font-size: 15px; font-weight: 650; }
.fechar {
  margin-left: auto; border: 0; background: transparent; color: var(--muted);
  font-size: 21px; line-height: 1; cursor: pointer; padding: 0 5px; border-radius: 6px;
}
.fechar:hover { background: var(--bg); color: var(--text); }
.modal-corpo { padding: 18px; display: flex; flex-direction: column; gap: 13px; }
.modal-pe {
  display: flex; align-items: center; gap: 9px; padding: 13px 18px;
  border-top: 1px solid var(--border); background: var(--bg); border-radius: 0 0 14px 14px;
}
.carimbos { font-size: 11.5px; color: var(--sutil); flex: 1; line-height: 1.35; }

.campo { display: flex; flex-direction: column; gap: 5px; }
.campo label { font-size: 12px; font-weight: 600; color: var(--muted); }
.campo input, .campo select, .campo textarea {
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); outline: none; transition: border-color .12s;
}
.campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--primary); }
.campo textarea { min-height: 72px; resize: vertical; }
.dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.secao-form {
  font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em;
  color: var(--sutil); margin: 4px 0 -4px; padding-top: 8px; border-top: 1px solid var(--border);
}
.check { display: flex; align-items: center; gap: 8px; }
.check label { font-size: 13px; font-weight: 500; color: var(--text); }
.pessoas { display: flex; flex-wrap: wrap; gap: 5px; }
.pessoas label {
  display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500;
  border: 1px solid var(--border); padding: 4px 9px; border-radius: 20px; cursor: pointer;
  transition: all .12s;
}
.pessoas label:has(input:checked) {
  background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark);
}
.pessoas .vazio { color: var(--sutil); font-size: 12.5px; }
/* Inativo só aparece no seletor quando já está no card — desenhado como resíduo, para
   ninguém achar que é uma opção nova. */
.pessoas label.inativa { border-style: dashed; color: var(--muted); }
.pessoas label.inativa em { font-style: normal; font-size: 10.5px; color: var(--sutil); }
.erro-form {
  background: var(--erro-bg); border: 1px solid var(--erro-borda); color: var(--erro-txt);
  padding: 9px 12px; border-radius: 8px; font-size: 13px;
}

/* ============================ TEMPO ====================================== */
.tempo-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tempo-bloco {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 15px; display: flex; flex-direction: column; gap: 3px;
}
.tempo-titulo { display: flex; align-items: baseline; gap: 7px; font-size: 12.5px; font-weight: 600; }
/* O `n` fica ao lado do título, e não no rodapé: mediana sem amostra à vista é número
   com cara de fato, e esta é a tela onde a amostra é pequena de verdade. */
.tempo-n { font-size: 10.5px; font-weight: 600; color: var(--sutil); font-variant-numeric: tabular-nums; }
.tempo-num { font-size: 30px; font-weight: 680; letter-spacing: -.02em; line-height: 1.1; }
.tempo-num span { font-size: 15px; font-weight: 600; color: var(--sutil); margin-left: 2px; }
.tempo-faixa { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tempo-vazio { font-size: 13px; color: var(--sutil); padding: 7px 0 5px; }
.tempo-obs-min { font-size: 11px; color: var(--sutil); margin-top: 4px; }
.tempo-obs { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; line-height: 1.5; }
.tempo-obs code {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 0 4px; font-size: 11.5px;
}
.tempo-longos { margin-top: 12px; }
.tempo-longos-cab { font-size: 11.5px; font-weight: 650; color: var(--muted); margin: 0 0 6px; }
.tempo-longo {
  display: flex; align-items: center; gap: 9px; padding: 6px 11px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); margin-bottom: 5px; font-size: 13px;
}
.tempo-longo .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tempo-longo b { font-variant-numeric: tabular-nums; color: var(--warn); }

/* ========================= ONDE CABE (agenda × fila) ===================== */
.ag-cabe {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--ok); border-radius: var(--radius-sm);
  padding: 9px 12px; margin-bottom: 10px;
}
.cabe-obs { font-size: 10.5px; font-weight: 650; text-transform: uppercase;
            letter-spacing: .05em; color: var(--sutil); }
.cabe-quando {
  font-size: 15px; font-weight: 650; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 7px;
}
.cabe-quando span { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.cabe-card { display: flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 12.5px; }
.cabe-card .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cabe-vazio { font-size: 12px; color: var(--sutil); margin-top: 4px; }

/* ============================ COBERTURA ================================== */
.cob-grade { display: flex; flex-direction: column; gap: 4px; }
.cob-cab, .cob-linha {
  display: grid; grid-template-columns: minmax(0, 1fr) repeat(5, 62px);
  align-items: center; gap: 5px;
}
.cob-cab span {
  font-size: 10.5px; font-weight: 650; color: var(--sutil); text-align: center;
  text-transform: uppercase; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis;
}
.cob-cab span:first-child { text-align: left; }
.cob-linha { background: var(--surface); border: 1px solid var(--border);
             border-radius: var(--radius-sm); padding: 7px 11px; }
.cob-nome { font-size: 13px; font-weight: 550; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
.cob-cel, .cob-total {
  text-align: center; font-size: 13px; font-weight: 650; border-radius: 6px;
  padding: 3px 0; font-variant-numeric: tabular-nums; background: var(--p-baixa-bg);
  color: var(--p-baixa);
}
/* Zero é o produto desta tela, então tem cor de atenção e não de "vazio" — e a legenda
   abaixo explica que significa NÃO OBSERVADO, não "foi mal". */
.cob-cel.zero { background: var(--p-media-bg); color: var(--p-media); }
.cob-total { background: var(--bg); color: var(--muted); }
.cob-total.zero { background: var(--p-alta-bg); color: var(--p-alta); }
.cob-total i { font-style: normal; font-size: 10px; vertical-align: super; }
.cob-obs { font-size: 11.5px; color: var(--sutil); margin: 9px 0 0; line-height: 1.5; }

/* =========================== REINCIDÊNCIA ================================ */
.rei-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 9px; }
.rei-item {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--p-media); border-radius: var(--radius-sm); padding: 10px 13px;
}
.rei-item.alarme { border-left-color: var(--p-alta); }
.rei-cab { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.rei-cab b { font-size: 13px; font-weight: 600; }
.rei-n { margin-left: auto; font-size: 11px; font-weight: 650; color: var(--muted);
         font-variant-numeric: tabular-nums; }
.rei-item.alarme .rei-n { color: var(--p-alta); }
.rei-meses { display: flex; gap: 4px; flex-wrap: wrap; margin: 7px 0 5px; }
.rei-meses span {
  font-size: 10.5px; font-weight: 600; background: var(--bg); color: var(--muted);
  border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px;
}
.rei-ultima {
  font-size: 12px; color: var(--muted); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ============================ MENU "NOVO" ================================ */
.novo-menu { position: relative; }
.novo-menu .seta { margin-left: 6px; font-size: 10px; opacity: .8; }
.novo-opcoes {
  display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 60;
  min-width: 232px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 5px;
}
.novo-menu.aberto .novo-opcoes { display: block; }
.novo-opcoes button {
  display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left;
  border: 0; background: transparent; color: var(--text); cursor: pointer;
  padding: 8px 10px; border-radius: var(--radius-sm); font-weight: 550; font-size: 13.5px;
}
.novo-opcoes button:hover { background: var(--bg); }
.novo-ico { width: 16px; flex: none; text-align: center; color: var(--sutil); font-size: 13px; }
/* A legenda é o que evita a pergunta "qual é a diferença entre Anotação e Nota?" no momento
   do clique — a distinção é conceitual, não visual. */
.novo-opcoes em { font-style: normal; font-size: 11.5px; color: var(--sutil); margin-left: auto; }

/* ============================== NOTAS ==================================== */
.notas-cab { display: flex; align-items: center; margin-bottom: 11px; }
.chip-n {
  margin-left: 6px; font-size: 10.5px; font-weight: 700; opacity: .75;
  font-variant-numeric: tabular-nums;
}
.notas-lista { display: flex; flex-direction: column; gap: 16px; }
.notas-dia-cab {
  font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em;
  color: var(--sutil); margin: 0 0 6px;
}
.nota {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start;
  gap: 4px 12px; background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border-forte); border-radius: var(--radius-sm);
  padding: 10px 13px; margin-bottom: 6px;
}
/* Arquivada continua legível, só recuada: ela existe para ser reencontrada, não escondida. */
.nota.arquivada { border-left-color: var(--border); opacity: .62; }
.nota-texto { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.nota-ligacoes { grid-column: 1; display: flex; flex-wrap: wrap; gap: 5px; }
.nota-lig {
  font-size: 11px; font-weight: 600; padding: 1.5px 8px; border-radius: 20px;
  border: 1px solid var(--border);
}
.nota-lig.pessoa { background: var(--primary-soft); color: var(--primary-dark); border-color: var(--primary-soft); }
.nota-lig.pessoa.inativa { background: transparent; color: var(--muted); border-style: dashed; }
.nota-lig.pessoa em { font-style: normal; font-size: 10px; color: var(--sutil); }
.nota-lig.card { background: var(--s-in-progress-bg); color: var(--s-in-progress); border-color: var(--s-in-progress-bg); }
/*
 * `grid-column: 2` é obrigatório, e não redundante com a ordem do HTML.
 *
 * Item travado em linha (`grid-row`) é posicionado pelo Grid ANTES dos automáticos. Sem a
 * coluna explícita, o botão era colocado primeiro e pegava a coluna 1 — a de `1fr` —,
 * empurrando o texto para a `auto`. Daí os dois sintomas do mesmo bug: nota curta deixava o
 * botão largo do lado errado, e nota longa fazia a `auto` comer todo o espaço, a `1fr`
 * colapsar para zero e o botão desaparecer por baixo do texto.
 *
 * `start` e não `center`: numa nota de dez linhas, centralizado o botão flutua no meio do
 * parágrafo. Alinhado ao topo ele fica na altura da primeira linha, que é onde o olho está.
 */
.nota-acao {
  grid-column: 2; grid-row: 1 / span 2; align-self: start;
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
  cursor: pointer; white-space: nowrap; transition: all .12s;
}
.nota-acao:hover { background: var(--bg); color: var(--text); border-color: var(--border-forte); }

/* ============================= PESSOAS =================================== */
/* Reusa `.painel` + `.linhas` + `.linha` da fila do Hoje: é a mesma forma — uma lista de
   registros clicáveis num cartão —, e um segundo desenho para a mesma coisa sairia de
   sincronia no primeiro ajuste de altura de linha. Só o que é próprio de Pessoas mora aqui. */
.pess { gap: 10px; cursor: default; }
.pess:hover { background: none; }        /* a linha inteira não é clicável; os botões são */
.pess .txt { flex: 0 1 auto; font-weight: 550; }

.pess-nivel {
  font-size: 11px; font-weight: 600; letter-spacing: .02em;
  background: var(--bg); color: var(--muted); border-radius: 20px; padding: 2px 8px;
}
/* Empurra o resto para a direita: o que vem depois é contexto e ação, não identidade. */
.pess-1a1 { margin-left: auto; font-size: 12px; color: var(--sutil); white-space: nowrap; }
.pess-alerta {
  font-size: 11.5px; color: var(--warn); font-weight: 600; white-space: nowrap;
}

/* Inativo em cinza e sem tachado: tachado diz "cancelado", e a pessoa não foi cancelada —
   ela saiu, e o nome dela continua sendo o que traduz o histórico. */
.pess.inativa .txt { color: var(--sutil); font-weight: 500; }

.pess-btn {
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
  cursor: pointer; white-space: nowrap; transition: all .12s;
}
.pess-btn:hover { background: var(--bg); color: var(--text); border-color: var(--border-forte); }

/* Numa tela estreita a linha vira duas: nome em cima, contexto e botões embaixo. Sem isto
   o `white-space: nowrap` do 1:1 e dos botões estoura a largura e cria rolagem lateral. */
@media (max-width: 620px) {
  .pess { flex-wrap: wrap; }
  .pess .txt { flex: 1 0 100%; }
  .pess-1a1 { margin-left: 0; }
}

/* ====================== DOCA DE COMENTÁRIOS DO 1:1 ======================= */
.doca {
  position: sticky; bottom: 0; background: var(--surface);
  border-top: 1px solid var(--border); box-shadow: var(--shadow-md);
  padding: 11px 26px 13px; display: flex; flex-direction: column; gap: 8px;
}
.doca-cab { display: flex; align-items: baseline; gap: 9px; }
.doca-titulo { font-size: 12px; font-weight: 650; }
.doca-obs { font-size: 12px; color: var(--muted); }
.doca-aviso { font-size: 11.5px; color: var(--sutil); }
.doca.sem-dono .doca-aviso { color: var(--warn); }
.doca-corpo { display: flex; align-items: flex-end; gap: 9px; }
/*
 * Cresce com o texto, até 40vh. O teto é aqui e não no JS de propósito: a doca é `sticky` no
 * rodapé da leitura, então cada pixel que ela ganha é um pixel que cobre o compilado que você
 * está usando para conduzir a conversa. Passado o teto, a rolagem interna assume.
 *
 * `align-items: flex-end` no pai é o que mantém o Gravar rente à base enquanto a caixa sobe.
 */
.doca-corpo textarea {
  flex: 1; min-width: 0; resize: vertical; min-height: 46px; max-height: 40vh;
  overflow-y: auto; line-height: 1.45;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); outline: none; font-size: 13.5px;
  transition: border-color .12s;
}
.doca-corpo textarea:focus { border-color: var(--primary); }

/* =============================== LOG ===================================== */
.log-acoes { margin-top: 11px; }
.log-visto { font-size: 11.5px; color: var(--sutil); margin: 8px 0 0; }
.log-falhas { display: flex; flex-direction: column; gap: 8px; }
.log-falha {
  background: var(--erro-bg); border: 1px solid var(--erro-borda);
  border-radius: var(--radius-sm); padding: 10px 13px;
}
.log-falha-cab { display: flex; align-items: baseline; gap: 9px; }
.log-falha-cab b { font-size: 12.5px; font-weight: 600; color: var(--erro-txt);
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A mensagem inteira, sem truncar: ela é o produto da tela — é o que diz qual campo
   corrigir. Cortada em uma linha, devolveria a pessoa para a pasta de erros do Drive. */
.log-msg {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px; line-height: 1.5; margin-top: 5px; color: var(--erro-txt);
  word-break: break-word;
}
.log-quando { margin-left: auto; font-size: 11px; color: var(--sutil); flex: none;
              font-variant-numeric: tabular-nums; }
.log-dica { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }
.log-lista { display: flex; flex-direction: column; gap: 3px; }
.log-linha {
  display: flex; align-items: center; gap: 9px; padding: 6px 11px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 12.5px;
}
.log-arquivo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-tipo { font-size: 11px; color: var(--sutil); flex: none; }
.log-ok        { background: var(--p-baixa-bg); color: var(--p-baixa); }
.log-ignorado  { background: var(--s-not-started-bg); color: var(--s-not-started); }
.log-erro      { background: var(--p-alta-bg); color: var(--p-alta); }
.log-sem       { background: var(--bg); color: var(--sutil); }

@media (max-width: 860px) {
  .app { flex-direction: column; }
  .lateral { width: auto; height: auto; position: static; flex-direction: row; align-items: center;
             border-right: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .menu { flex-direction: row; padding: 8px; }
  .lateral-pe { margin: 0 0 0 auto; flex-direction: row; padding: 8px; }
  .recolher { display: none; }
  .busca input { width: 100%; }
  .coluna { max-width: none; }
  .pessoa-linha { grid-template-columns: 1fr 80px; grid-row-gap: 7px; }
  .dupla { grid-template-columns: 1fr; }
  /* A grade de cobertura tem 5 colunas fixas de 62px: em tela estreita o nome some.
     Rola em vez de comprimir — número ilegível não é dado. */
  .cob-grade { overflow-x: auto; }
  .cob-cab, .cob-linha { grid-template-columns: minmax(110px, 1fr) repeat(5, 52px); }
  /* A agenda desce para baixo da fila: em tela estreita a coluna comeria a fila, e a ordem
     de leitura continua sendo trabalho primeiro. */
  .hoje-duas { grid-template-columns: 1fr; }
  /* A anotação empilha na ordem de leitura, e é UMA linha porque as células têm nome.
     Com posicionamento automático isto seria seis regras de `grid-column`/`grid-row`. */
  .anot {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "quem" "tipo" "nota" "evid" "data" "valores";
  }
  .anot-data { text-align: left; }
  .anot-valores { justify-content: flex-start; }
}

/* Não há media query intermediária: o `minmax(300px, 420px)` da grade já encolhe a agenda
   até o piso sozinho, e a fila cede o resto. Um breakpoint aqui seria uma segunda regra
   repetindo o que a primeira faz — e as duas sairiam de sincronia na próxima mudança. */
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="lateral">
    <div class="lateral-topo">
      <span class="marca-ponto"></span>
      <span class="marca-nome">Gestão</span>
      <button class="recolher" id="btnRecolher" onclick="alternarLateral()"
              title="Recolher menu">&#9664;</button>
    </div>

    <nav class="menu">
      <button class="menu-item ativa" id="menu-hoje" onclick="irPara('hoje')">
        <span class="menu-ico">&#9788;</span><span>Hoje</span><span id="sinoHoje"></span></button>
      <button class="menu-item" id="menu-board" onclick="irPara('board')">
        <span class="menu-ico">&#9776;</span><span>Board</span></button>
      <button class="menu-item" id="menu-dashboard" onclick="irPara('dashboard')">
        <span class="menu-ico">&#9638;</span><span>Dashboard</span></button>
      <button class="menu-item" id="menu-anotacoes" onclick="irPara('anotacoes')">
        <span class="menu-ico">&#9998;</span><span>Anotações</span></button>
      <button class="menu-item" id="menu-notas" onclick="irPara('notas')">
        <span class="menu-ico">&#9633;</span><span>Notas</span><span id="sinoNotas"></span></button>
      <button class="menu-item" id="menu-resumos" onclick="irPara('resumos')">
        <span class="menu-ico">&#9993;</span><span>Resumos</span></button>
      <!-- Cadastro, e por isso fica no fim: é a única tela que não se abre todo dia. Mas
           precisa existir, porque `ativo` é o campo que decide quem aparece em TODAS as
           outras — e até aqui ele só podia ser marcado à mão na planilha. -->
      <button class="menu-item" id="menu-pessoas" onclick="irPara('pessoas')">
        <span class="menu-ico">&#9787;</span><span>Pessoas</span></button>
      <!-- O contador é o ponto do Log: a aba resolve investigação, mas quem não desconfia
           não abre. O número no menu é o que faz desconfiar. -->
      <button class="menu-item" id="menu-log" onclick="irPara('log')">
        <span class="menu-ico">&#9707;</span><span>Log</span><span id="sinoLog"></span></button>
    </nav>

    <div class="lateral-pe">
      <button class="btn" id="btnSincronizar" onclick="sincronizar()" title="Sincronizar">
        <span>Sincronizar</span></button>
      <button class="btn" id="btnRecarregar" onclick="recarregarTudo()" title="Recarregar">
        <span>Recarregar</span></button>
      <!-- O glifo tem classe própria porque a regra de recolhido esconde todo <span> dos
           botões do pé. Só o rótulo some; o ícone sobrevive e o botão continua legível. -->
      <button class="btn" id="btnTema" onclick="alternarTema()"><span class="btn-ico"
        id="btnTemaIco">&#9789;</span><span id="btnTemaTxt">Tema escuro</span></button>
    </div>
  </aside>

  <main class="principal">
    <header class="topo">
      <h1 id="tituloVisao">Hoje</h1>
      <span class="sub" id="subVisao"></span>
      <span class="espaco"></span>

      <div class="busca" id="caixaBusca" style="display:none">
        <span class="lupa">&#9906;</span>
        <input type="text" id="busca" placeholder="Buscar título…  (/)" autocomplete="off" oninput="aoBuscar()">
        <button class="limpar" onclick="limparBusca()" title="Limpar">&times;</button>
      </div>

      <!-- "Novo" com as três opções abaixo dele, em vez de um botão que muda com a visão:
           criar não depende de onde você está, e o rótulo fixo deixa de exigir que alguém
           adivinhe o que o botão faz nesta tela. -->
      <div class="novo-menu" id="novoMenu">
        <button class="btn btn-primario" id="btnPrimario" onclick="alternarNovo(event)"
                aria-haspopup="true" aria-expanded="false">Novo<span class="seta">&#9662;</span></button>
        <div class="novo-opcoes" id="novoOpcoes" role="menu">
          <button role="menuitem" onclick="escolherNovo('card')">
            <span class="novo-ico">&#9776;</span>Card<em>demanda no board</em></button>
          <button role="menuitem" onclick="escolherNovo('anotacao')">
            <span class="novo-ico">&#9998;</span>Anotação<em>feedback de alguém</em></button>
          <button role="menuitem" onclick="escolherNovo('nota')">
            <span class="novo-ico">&#9633;</span>Nota<em>recado solto, sem juízo</em></button>
          <button role="menuitem" onclick="escolherNovo('pessoa')">
            <span class="novo-ico">&#9787;</span>Pessoa<em>alguém novo no time</em></button>
        </div>
      </div>
    </header>

    <!-- Separado do #aviso porque o carregar() limpa aquele; o resultado da sincronia
         precisa sobreviver ao recarregamento que vem logo depois dela. -->
    <div class="faixa" id="avisoSync"></div>
    <div class="faixa" id="aviso"></div>
    <div id="conteudo"><p class="carregando">Carregando…</p></div>
  </main>
</div>

<!-- =============== LEITURA DO RESUMO, em tela cheia =============== -->
<div class="leitura" id="leitura">
  <div class="leitura-topo">
    <span class="leitura-quem" id="leituraQuem"></span>
    <span class="leitura-data" id="leituraData"></span>
    <span class="espaco"></span>

function irPara(destino) {

function alternarNovo(ev) {
  if (ev) ev.stopPropagation();

  var aberto = menu.classList.toggle('aberto');
  document.getElementById('btnPrimario').setAttribute('aria-expanded', aberto ? 'true' : 'false');
}

  document.getElementById('novoMenu').classList.remove('aberto');
  document.getElementById('btnPrimario').setAttribute('aria-expanded', 'false');
}

}

/* ==========================================================================
   TEMA

   Duas coisas separadas: o que está na tela agora (`data-tema`) e o que fica
   guardado (`data-tema-pref`). O script do <head> resolve a primeira a partir da
   segunda; daqui para baixo é só a troca e o registro.
   ========================================================================== */

/* Troca o tema na hora e grava a preferência depois — nesta ordem.
   A escrita passa pelo `google.script.run` e leva uns décimos; esperar por ela para só
   então pintar deixaria o clique sem resposta. E se a gravação falhar, o tema da sessão
   continua certo: o que se perde é a memória, não o efeito, e o aviso diz isso. */
function alternarTema() {
  var raiz = document.documentElement;
  var escuro = raiz.getAttribute('data-tema') !== 'escuro';
  var pref = escuro ? 'escuro' : 'claro';

  raiz.setAttribute('data-tema-pref', pref);
  raiz.setAttribute('data-tema', pref);
  pintarBotaoTema();

  google.script.run
    .withFailureHandler(function (err) {
      document.getElementById('aviso').innerHTML =
        '<div class="aviso">O tema mudou, mas não foi possível guardar a preferência: ' +
        esc(mensagem(err)) + ' Ela volta ao padrão no próximo carregamento.</div>';
    })
    .salvarTema(pref);
}

/* O botão anuncia o DESTINO, não o estado: no claro ele oferece o escuro. É a convenção
   que evita a pergunta "isto é o que está ligado ou o que vai acontecer?". */
function pintarBotaoTema() {
  var escuro = document.documentElement.getAttribute('data-tema') === 'escuro';
  document.getElementById('btnTemaIco').innerHTML = escuro ? '&#9788;' : '&#9789;';
  document.getElementById('btnTemaTxt').textContent = escuro ? 'Tema claro' : 'Tema escuro';
  document.getElementById('btnTema').title = escuro ? 'Mudar para o tema claro'
                                                    : 'Mudar para o tema escuro';
}

function desenhar() {
  var alvo = document.getElementById('conteudo');
  if (visao === 'board') { alvo.innerHTML = htmlBoard(); ligarArrasto(); }
  else if (visao === 'hoje') alvo.innerHTML = htmlHoje();
  else if (visao === 'dashboard') { alvo.innerHTML = htmlDashboard(); ligarGantt(); }
  else if (visao === 'resumos') alvo.innerHTML = htmlResumos();
  else if (visao === 'notas') alvo.innerHTML = htmlNotas();
  else if (visao === 'pessoas') alvo.innerHTML = htmlPessoas();
  else if (visao === 'log') alvo.innerHTML = htmlLog();
  else alvo.innerHTML = htmlAnotacoes();

  atualizarSub();
  atualizarSino();
}

function atualizarSub() {
  var sub = '';
  if (visao === 'board') sub = cards.length + (cards.length === 1 ? ' card' : ' cards');
  else if (visao === 'dashboard') sub = ativos().length + ' ativos';
  else if (visao === 'anotacoes' && anotacoes) sub = anotacoes.length + ' anotações';
  else if (visao === 'pessoas') sub = pessoasAtivas.length + ' no time';
  else if (visao === 'log' && log) sub = 'últimos ' + log.dias + ' dias';
  document.getElementById('subVisao').textContent = sub;
}

/* Os sinos do menu contam o que justifica interromper: prazo estourado, captura perdida, e
   nota aberta esperando leitura. `naoVistos` e não `erros` — ver o `marcarLogVisto`. */
function atualizarSino() {
  sino('sinoHoje', vencidos().length);
  sino('sinoLog', log ? log.naoVistos : 0);
  sino('sinoNotas', notas ? notasAbertas().length : 0);
}

function sino(id, n) {
  document.getElementById(id).outerHTML = n
    ? '<span class="menu-sino" id="' + id + '">' + n + '</span>'
    : '<span id="' + id + '"></span>';
}

/* ==========================================================================
   CARGA
   ========================================================================== */
function recarregarTudo() {
  carregar();
  carregarAgenda();
  carregarLog();
  carregarNotas();
  if (anotacoes !== null) carregarAnotacoesEmSilencio();
}

/**
 * O log, em chamada própria e sem trocar a tela por "carregando".
 *
 * Vem sempre — inclusive quando a aba aberta é outra —, porque o produto dele é o contador
 * do menu. Falha aqui não pode atrapalhar nada: o contador simplesmente não aparece, e a
 * aba explica o motivo quando alguém abrir.
 */
function carregarLog() {
  google.script.run
    .withSuccessHandler(function (r) {
      log = r;
      erroLog = '';
      atualizarSino();
      if (visao === 'log') desenhar();
    })
    .withFailureHandler(function (err) {
      log = null;
      erroLog = mensagem(err);
      atualizarSino();
      if (visao === 'log') desenhar();
    })
    .listLog();
}

/** As notas, em chamada própria — como o log, porque o contador do menu depende delas. */
function carregarNotas() {
  google.script.run
    .withSuccessHandler(function (lista) {
      notas = lista || [];
      erroNotas = '';
      atualizarSino();
      if (visao === 'notas') desenhar();
    })
    .withFailureHandler(function (err) {
      notas = [];
      erroNotas = mensagem(err);
      atualizarSino();
      if (visao === 'notas') desenhar();
    })
    .listNotas();
}

function carregar() {
  document.getElementById('btnRecarregar').disabled = true;
  document.getElementById('aviso').innerHTML = '';

  google.script.run
    .withSuccessHandler(aoCarregar)
    .withFailureHandler(mostrarErro)
    .listCards();
}

function aoCarregar(resposta) {
  document.getElementById('btnRecarregar').disabled = false;

  cards = resposta.cards || [];
  ignoradas = resposta.ignoradas || 0;

  cardsPorId = {};
  cards.forEach(function (card) { cardsPorId[card.id] = card; });

  if (ignoradas > 0) {
    document.getElementById('aviso').innerHTML =
      '<div class="aviso">' + ignoradas + ' linha(s) da aba com conteúdo mas sem ' +
      '<b>id</b> foram ignoradas. Cards sem id não podem ser editados — provavelmente ' +
      'foram digitados direto na planilha em vez de criados pela camada de acesso.</div>';
  }

  if (visao !== 'anotacoes') desenhar();
  else atualizarSino();
}

function carregarAnotacoes() {
  document.getElementById('conteudo').innerHTML = '<p class="carregando">Carregando anotações…</p>';

  google.script.run
    .withSuccessHandler(function (lista) { anotacoes = lista || []; erroAnotacoes = ''; desenhar(); })
    .withFailureHandler(function (err) { anotacoes = []; erroAnotacoes = mensagem(err); desenhar(); })
    .listAnotacoes();
}

function carregarResumos() {
  document.getElementById('conteudo').innerHTML = '<p class="carregando">Carregando resumos…</p>';

  google.script.run
    .withSuccessHandler(function (r) { resumos = r; erroResumos = ''; desenhar(); })
    .withFailureHandler(function (err) { resumos = null; erroResumos = mensagem(err); desenhar(); })
    .listResumos();
}

/**
 * A agenda, em chamada própria.
 *
 * Não redesenha a tela inteira ao pedir — a fila do dia já está lá, e trocá-la por
 * "carregando" para buscar a coluna da direita seria piorar o que já funciona. Quando a
 * resposta chega, redesenha só se a tela Hoje ainda estiver aberta.
 */
function carregarAgenda() {
  google.script.run
    .withSuccessHandler(function (a) {
      agenda = a;
      erroAgenda = '';
      if (visao === 'hoje') desenhar();
    })
    .withFailureHandler(function (err) {
      agenda = null;
      erroAgenda = mensagem(err);
      if (visao === 'hoje') desenhar();
    })
    .listAgenda();
}

function carregarAnotacoesEmSilencio() {
  google.script.run
    .withSuccessHandler(function (lista) {
      anotacoes = lista || [];
      if (visao === 'anotacoes') desenhar();
    })
    .withFailureHandler(function () { /* a aba avisa quando for aberta */ })
    .listAnotacoes();
}

function mostrarErro(err) {
  document.getElementById('btnRecarregar').disabled = false;
  document.getElementById('conteudo').innerHTML =
    '<div class="faixa"><div class="erro"><b>Não foi possível carregar os cards.</b>' +
    'A chamada listCards() falhou no servidor.' +
    '<code>' + esc(mensagem(err)) + '</code></div></div>';
}

/* ==========================================================================
   RECORTES — as regras de negócio da leitura, num lugar só
   ========================================================================== */
function ativos() {
  return cards.filter(function (c) { return c.status !== STATUS_DONE; });
}

/**
 * O que ele executa: ativo e **não travado no cliente**.
 *
 * Card com `aguardando_cliente` sai da fila do dia mesmo com prazo em cima — a bola está
 * do outro lado, e mandar "faça isto" para algo que ele não pode fazer é ruído. Ele
 * aparece uma vez só, no bloco de cliente. Sem esta exclusão o mesmo card saía nos dois
 * lugares, que era metade da confusão da tela.
 */
function executaveis() {
  return ativos().filter(function (c) { return c.aguardando_cliente !== true; });
}

/**
 * O que já está na mão: status `In progress`.
 *
 * Sai de `executaveis()`, e não de `ativos()`, para valer a mesma exclusão dos blocos de
 * prazo — card em andamento e travado no cliente continua aparecendo uma vez só, no bloco
 * de cliente. Sem isso o "In progress" viraria a exceção à regra do `04`, e justamente no
 * bloco que abre a tela.
 *
 * **Este é o único bloco da fila que pode repetir um card**, e é de propósito: ele corta
 * por status, e os três de baixo cortam por prazo. Um card em andamento que vence hoje é
 * verdadeiramente as duas coisas, e omiti-lo aqui faria o bloco mentir sobre o que está
 * aberto — que é a pergunta que ele responde.
 */
function emAndamento() {
  return executaveis().filter(function (c) { return c.status === STATUS_EM_ANDAMENTO; });
}

/* Vencido nunca inclui Done: card concluído com prazo passado não é atraso, é história. */
function vencidos() {
  var hoje = hojeIso();
  return executaveis().filter(function (c) { return c.prazo && c.prazo < hoje; });
}

function vencemEm(iso) {
  return executaveis().filter(function (c) { return c.prazo === iso; });
}

/* Delegado parado: o relógio é `data_delegacao`, carimbada a cada entrada em Delegado. */
function delegadosAConferir(jaListados) {
  var limite = isoMenosDias(DIAS_CONFERIR_DELEGADO);
  var hoje = hojeIso();

  return cards.filter(function (c) {
    if (c.status !== STATUS_DELEGADO || !c.data_delegacao) return false;
    if (c.data_delegacao > limite) return false;
    return jaListados.indexOf(c.id) < 0;   // já apareceu por prazo — não repete
  }).map(function (c) {
    return { card: c, dias: diasEntre(c.data_delegacao, hoje) };
  }).sort(function (a, b) { return b.dias - a.dias; });
}

function aguardandoCliente() {
  return ativos().filter(function (c) { return c.aguardando_cliente === true; });
}

/* ==========================================================================
   HOJE — a tela principal
   --------------------------------------------------------------------------
   Reinterpreta o painel do Notion, que era uma lista vertical porque vivia num embed
   estreito. Aqui é calculada ao vivo da planilha: sempre fresca, sem depender de
   rotina agendada. O que ela não faz é julgar — "o que travou e por quê" continua
   sendo prosa da rotina-semanal.
   ========================================================================== */
function htmlHoje() {
  var hoje = hojeIso();
  var d = new Date();

  var listaAndamento = emAndamento();
  var listaVencidos = vencidos();
  var listaHoje = vencemEm(hoje);
  var listaAmanha = vencemEm(isoMaisDias(1));

  var jaListados = listaVencidos.concat(listaHoje, listaAmanha).map(function (c) { return c.id; });

  /* Duas colunas, e a da direita é de outra natureza — ver `04`. A fila responde "o quê";
     a agenda responde "quando cabe". Não competem pela mesma ordem de leitura, que foi o
     motivo de a divisão anterior (duas colunas de trabalho) ter sido desfeita. */
  return '<div class="pagina hoje hoje-duas">' +
    '<div class="hoje-fila">' +
      '<div class="hoje-cab">' +
        '<div class="dia">' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() + '</div>' +
        veredito(listaVencidos, listaHoje, listaAmanha) +
      '</div>' +

      /* Abre a fila porque é o que já foi começado: antes de escolher o que puxar, a
         pergunta é o que ficou aberto. Recortado em cinco para não empurrar o Vencido
         para fora da primeira tela — o resto abre a pedido, e o cabeçalho diz quantos. */
      bloco('Em andamento', 'b-andamento', listaAndamento, 'Nada em andamento.', {
        limite: MAX_EM_ANDAMENTO,
        expandido: emAndamentoExpandido,
        alternar: 'alternarEmAndamento()'
      }) +

      bloco('Vencido', 'b-vencido', listaVencidos, 'Nada vencido.') +
      bloco('Vence hoje', 'b-hoje', listaHoje, 'Nada vencendo hoje.') +
      bloco('Amanhã', 'b-amanha', listaAmanha, 'Nada para amanhã.') +

      '<div class="secao"><p class="secao-titulo">De olho</p>' +
        '<div class="de-olho">' +
          olhoDelegados(delegadosAConferir(jaListados)) +
          olhoCliente(aguardandoCliente()) +
          olho1a1() +
        '</div>' +
      '</div>' +
    '</div>' +

    '<aside class="hoje-agenda">' + htmlAgenda() + '</aside>' +
  '</div>';
}

/* ==========================================================================
   AGENDA DO DIA
   --------------------------------------------------------------------------
   Linha do tempo com os vãos desenhados, e o próximo compromisso em destaque
   acima dela. Ver `04`.

   Os dois respondem perguntas diferentes e é por isso que os dois ficaram: o
   destaque responde "o que vem agora", que se lê de relance; a linha do tempo
   responde "onde o trabalho cabe", que é o que nem o app nem o Google Calendar
   dão isolados. O que nenhum dos dois faz é repetir a lista de reuniões — para
   isso o Calendar já basta.
   ========================================================================== */

function htmlAgenda() {
  var cab = '<div class="ag-cab"><p class="secao-titulo">Agenda de hoje</p></div>';

  if (erroAgenda) {
    return cab + '<div class="ag-caixa"><div class="erro"><b>Agenda indisponível.</b>' +
      '<code>' + esc(erroAgenda) + '</code></div></div>';
  }
  if (!agenda) return cab + '<p class="carregando">Carregando agenda…</p>';

  return cab + faixaDiaInteiro() + focoAgenda() + ondeCabe() + agendaLinha() + rodapeAgenda();
}

/**
 * O maior vão que ainda vem, e o topo da fila para ocupá-lo.
 *
 * É a única coisa que nasce de a agenda existir: o app já sabia o que fazer e agora sabe
 * quando há espaço, e ninguém cruzava os dois. Fica **acima** da linha do tempo porque é
 * conclusão, e a linha é a evidência dela.
 *
 * **Não promete que caiba.** Não existe campo de estimativa no schema, então dizer "cabe
 * este card" seria inventar uma duração — o texto sugere o que pegar, e o tamanho do vão
 * fica ao lado para você decidir. Ver `04`.
 */
function ondeCabe() {
  if (!agenda) return '';

  /* Vão que já passou não é oportunidade. O corte é `agoraMin`, e um vão em curso conta
     pelo que sobra dele — é o que está de fato disponível. */
  var restantes = agenda.vaos
    .filter(function (v) { return v.fimMin > agenda.agoraMin; })
    .map(function (v) {
      var inicio = Math.max(v.inicioMin, agenda.agoraMin);
      return { inicioMin: inicio, fimMin: v.fimMin, minutos: v.fimMin - inicio };
    })
    .filter(function (v) { return v.minutos >= VAO_MINIMO_UI; });

  if (!restantes.length) return '';

  var maior = restantes.reduce(function (a, b) { return b.minutos > a.minutos ? b : a; });
  var topo = filaDoDia()[0];

  var sugestao = topo
    ? '<div class="cabe-card"><span class="pill ' +
        (CLASSE_PRIORIDADE[topo.prioridade] || '') + '">' + esc(topo.prioridade || '—') +
        '</span><span class="txt">' + esc(topo.titulo || '(sem título)') + '</span></div>'
    : '<div class="cabe-vazio">Nada vencendo — vão livre para o que você escolher.</div>';

  return '<div class="ag-cabe">' +
      '<div class="cabe-obs">Maior vão restante</div>' +
      '<div class="cabe-quando">' + horaCurta(maior.inicioMin) + '–' +
        horaCurta(maior.fimMin) + '<span>' + duracao(maior.minutos) + '</span></div>' +
      sugestao +
    '</div>';
}

/** Os três blocos do Hoje numa lista só, na mesma ordem em que eles aparecem. */
function filaDoDia() {
  var hoje = hojeIso();
  return vencidos().concat(vencemEm(hoje), vencemEm(isoMaisDias(1))).sort(porFilaDoDia);
}

/* Evento de dia inteiro não tem hora para ocupar, então não entra na linha do tempo nem
   na lista: vira faixa no topo. Ver `04`. */
function faixaDiaInteiro() {
  if (!agenda.diaInteiro.length) return '';
