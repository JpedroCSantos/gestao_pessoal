<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
/* ==========================================================================
   TOKENS — base do model-app (indigo sobre cinza, radius 12, sombra discreta),
   com as cores de estado dos painéis do Notion, que já são o vocabulário dele.
   ========================================================================== */
:root {
  --primary: #6366f1; --primary-dark: #4f46e5; --primary-soft: #eef2ff;
  --bg: #f8f9fa; --surface: #ffffff; --border: #e5e7eb; --border-forte: #d1d5db;
  --text: #1f2937; --muted: #6b7280; --sutil: #9ca3af;
  --ok: #059669; --warn: #d97706; --bad: #dc2626;

  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  --shadow-md: 0 4px 12px rgba(16,24,40,.10), 0 2px 4px rgba(16,24,40,.06);

  --s-not-started: #6b7280; --s-not-started-bg: #f3f4f6;
  --s-in-progress: #3b6591; --s-in-progress-bg: #e8f0fa;
  --s-done: #1e8449;        --s-done-bg: #e9f7ee;
  --s-delegado: #a8622d;    --s-delegado-bg: #fbe9dc;
  --s-sem: #9ca3af;         --s-sem-bg: #f3f4f6;

  --p-alta: #c0392b;  --p-alta-bg: #fdecec;
  --p-media: #a86a00; --p-media-bg: #fef6e0;
  --p-baixa: #1e8449; --p-baixa-bg: #e9f7ee;

  --lateral: 216px;
}

* { box-sizing: border-box; }

body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }

/* ============================ SHELL ====================================== */
.app { display: flex; min-height: 100vh; }

.lateral {
  width: var(--lateral); flex: none; background: var(--surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; transition: width .16s ease;
}
.app.compacta .lateral { width: 58px; }

.lateral-topo { display: flex; align-items: center; gap: 9px; padding: 14px 14px 10px; }
.marca-ponto {
  width: 24px; height: 24px; border-radius: 7px; flex: none;
  background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
}
.marca-nome { font-weight: 650; letter-spacing: -.01em; }
.recolher {
  margin-left: auto; border: 0; background: transparent; color: var(--sutil);
  cursor: pointer; padding: 3px 6px; border-radius: 6px; line-height: 1; font-size: 15px;
}
.recolher:hover { background: var(--bg); color: var(--text); }

.menu { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  border: 0; background: transparent; cursor: pointer; color: var(--muted);
  padding: 8px 10px; border-radius: 9px; font-weight: 550; font-size: 13.5px; text-align: left;
  transition: background .12s, color .12s;
}
.menu-item:hover { background: var(--bg); color: var(--text); }
.menu-item.ativa { background: var(--primary-soft); color: var(--primary-dark); }
.menu-ico { width: 18px; text-align: center; flex: none; font-size: 15px; }
.menu-sino {
  margin-left: auto; font-size: 11px; font-weight: 700; background: var(--bad); color: #fff;
  border-radius: 20px; padding: 0 6px; min-width: 18px; text-align: center;
}
.lateral-pe { margin-top: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

/* O botão de recolher NUNCA some — ele é o único caminho de volta. Escondê-lo no modo
   compacto deixava a lateral fechada para sempre. */
.app.compacta .marca-nome,
.app.compacta .menu-item span:not(.menu-ico):not(.menu-sino),
.app.compacta .lateral-pe .btn span { display: none; }
.app.compacta .menu-item { justify-content: center; padding: 9px 0; }
.app.compacta .lateral-topo { flex-direction: column; gap: 6px; padding: 14px 0 10px; }
.app.compacta .recolher { margin: 0; }

.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topo {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 22px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.topo h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.topo .sub { color: var(--sutil); font-size: 12.5px; }
.espaco { flex: 1; }

.busca { position: relative; }
.busca input {
  width: 230px; padding: 7px 30px 7px 32px; border: 1px solid var(--border);
  border-radius: 9px; background: var(--bg); outline: none; transition: border-color .12s, background .12s;
}
.busca input:focus { border-color: var(--primary); background: var(--surface); }
.busca .lupa { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--sutil); pointer-events: none; }
.busca .limpar {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--sutil); cursor: pointer;
  padding: 2px 5px; border-radius: 5px; line-height: 1; display: none;
}
.busca.tem-texto .limpar { display: block; }
.busca .limpar:hover { background: var(--border); color: var(--text); }

.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 7px 13px; border-radius: 9px; cursor: pointer; font-weight: 550; font-size: 13px;
  transition: background .12s, border-color .12s; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--bg); border-color: var(--border-forte); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-primario { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primario:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }

/* ============================ AVISOS ===================================== */
.faixa { margin: 12px 22px 0; }
.faixa:empty { display: none; }
.aviso, .erro {
  border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm);
  padding: 10px 14px; box-shadow: var(--shadow);
}
.aviso { border-left: 3px solid var(--warn); }
.aviso.ok { border-left-color: var(--ok); }
.erro { border-left: 3px solid var(--bad); }
.erro b { display: block; margin-bottom: 3px; }
.erro code {
  display: block; margin-top: 7px; font-size: 12px; color: var(--muted);
  background: var(--bg); padding: 7px 9px; border-radius: 6px; word-break: break-word;
}
.carregando { color: var(--muted); padding: 46px 22px; text-align: center; }

.pagina { padding: 18px 22px 44px; }
.secao-titulo {
  font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em;
  color: var(--sutil); margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
}
.secao-num {
  background: var(--bg); color: var(--muted); border-radius: 20px; padding: 0 7px;
  font-size: 11px; letter-spacing: 0;
}
.secao + .secao { margin-top: 24px; }
.vazio-msg { color: var(--sutil); font-size: 13px; margin: 0; padding: 4px 0; }
.painel {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}

/* ============================ HOJE ======================================= */
/* Uma coluna só, de cima para baixo, na ordem da urgência. A versão de duas colunas
   criava duas ordens de leitura paralelas: o olho não sabia por onde começar nem como
   os dois lados se relacionavam. Aqui existe um caminho, e ele é vertical. */
.hoje { max-width: 900px; }
.hoje-cab { margin-bottom: 20px; }
.hoje-cab .dia { font-size: 12.5px; color: var(--sutil); text-transform: uppercase; letter-spacing: .05em; }
/* O veredito é a coisa mais alta da tela de propósito: ele responde "por onde começo"
   antes de qualquer lista, que é a pergunta que traz alguém aqui às nove da manhã. */
.veredito { font-size: 25px; font-weight: 650; letter-spacing: -.025em; margin: 3px 0 0; }
.veredito.urgente { color: var(--bad); }
.veredito.calmo { color: var(--ok); }
.veredito-obs { color: var(--muted); font-size: 13.5px; margin-top: 3px; }

/* Cada bloco de prazo tem uma cor de urgência na aresta. É o que substitui a divisão
   em colunas: a hierarquia passou a ser vertical e cromática, não espacial. */
.bloco { margin-bottom: 20px; }
.bloco-cab {
  display: flex; align-items: center; gap: 9px; margin: 0 0 8px;
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
}
.bloco-cab .n {
  font-size: 11px; font-weight: 700; border-radius: 20px; padding: 0 7px;
  background: currentColor; color: #fff; letter-spacing: 0;
}
.bloco-cab .n span { filter: none; }
.bloco.b-vencido .bloco-cab { color: var(--bad); }
.bloco.b-hoje .bloco-cab { color: var(--primary-dark); }
.bloco.b-amanha .bloco-cab { color: var(--muted); }
.bloco .painel { border-left: 3px solid currentColor; }
.bloco.b-vencido .painel { border-left-color: var(--bad); }
.bloco.b-hoje .painel { border-left-color: var(--primary); }
.bloco.b-amanha .painel { border-left-color: var(--border-forte); }

.linhas { display: flex; flex-direction: column; }
.linha {
  display: flex; align-items: center; gap: 9px; padding: 10px 14px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s;
}
.linha:last-child { border-bottom: 0; }
.linha:hover { background: var(--bg); }
.linha .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* "De olho": o que se monitora, não o que se executa. Fica embaixo e em cartão menor
   justamente para não competir com a fila do dia. */
.de-olho { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.olho {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 13px 15px;
}
.olho h3 {
  margin: 0 0 9px; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--sutil); display: flex; align-items: center; gap: 7px;
}
.olho-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px;
  border-bottom: 1px solid var(--border); cursor: pointer;
}
.olho-item:last-child { border-bottom: 0; }
.olho-item:hover .olho-txt { color: var(--primary-dark); }
.olho-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.olho .vazio-msg { padding: 0; }
.badge, .status {
  font-size: 11px; font-weight: 600; padding: 1.5px 7px; border-radius: 5px; white-space: nowrap; flex: none;
}
.st-not-started { background: var(--s-not-started-bg); color: var(--s-not-started); }
.st-in-progress { background: var(--s-in-progress-bg); color: var(--s-in-progress); }
.st-done        { background: var(--s-done-bg);        color: var(--s-done); }
.st-delegado    { background: var(--s-delegado-bg);    color: var(--s-delegado); }
.st-sem-status  { background: var(--s-sem-bg);         color: var(--s-sem); }
.chip-pessoa {
  font-size: 11px; color: var(--muted); background: var(--bg);
  padding: 1.5px 7px; border-radius: 5px; white-space: nowrap; flex: none;
}
.dias-fora { font-size: 11px; color: var(--bad); font-weight: 600; flex: none; }

.um-a-um {
  background: linear-gradient(135deg, var(--primary-soft) 0%, #f5f3ff 100%);
  border: 1px solid #ddd6fe; border-radius: var(--radius); padding: 14px 16px;
}
.um-a-um .quem { font-size: 16px; font-weight: 650; margin: 3px 0; }
.um-a-um .obs { font-size: 12.5px; color: var(--muted); }

/* ============================ BOARD ====================================== */
.board { display: flex; gap: 14px; align-items: flex-start; padding: 18px 22px 44px; overflow-x: auto; }
.coluna {
  flex: 1 1 0; min-width: 246px; max-width: 340px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  transition: border-color .12s, background .12s;
}
.coluna-cab {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 13px; border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none;
}
.coluna-cab:hover .coluna-nome { color: var(--primary); }
.ponto { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.s-not-started { background: var(--s-not-started); }
.s-in-progress { background: var(--s-in-progress); }
.s-done        { background: var(--s-done); }
.s-delegado    { background: var(--s-delegado); }
.s-sem-status  { background: var(--s-sem); }
.coluna-nome { font-weight: 600; font-size: 13px; transition: color .12s; }
.coluna-num {
  margin-left: auto; font-size: 12px; color: var(--muted);
  background: var(--bg); padding: 1px 8px; border-radius: 20px; font-variant-numeric: tabular-nums;
}
.coluna-ocultos { font-size: 11px; color: var(--sutil); }
.coluna-corpo { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.coluna-vazia { color: var(--sutil); font-size: 12.5px; text-align: center; padding: 14px 0; margin: 0; }
.coluna-opcoes {
  display: flex; align-items: center; gap: 7px; padding: 8px 13px;
  border-bottom: 1px solid var(--border); background: var(--bg);
  font-size: 12px; color: var(--muted);
}
.coluna-opcoes label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

/* Colapsada vira um trilho estreito: devolve a largura para as colunas em movimento,
   que é o ponto — Done é histórico, e histórico não merece um quinto da tela. */
.coluna.colapsada { flex: 0 0 46px; min-width: 46px; max-width: 46px; }
.coluna.colapsada .coluna-cab {
  flex-direction: column; gap: 10px; border-bottom: 0; padding: 12px 0; height: 100%;
}
.coluna.colapsada .coluna-nome { writing-mode: vertical-rl; text-orientation: mixed; }
.coluna.colapsada .coluna-num { margin: 0; }
.coluna.colapsada .coluna-corpo,
.coluna.colapsada .coluna-opcoes { display: none; }

.tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 11px; cursor: pointer; position: relative;
  transition: box-shadow .12s, border-color .12s;
}
.tile:hover { box-shadow: var(--shadow-md); border-color: var(--border-forte); }
.tile:active { cursor: grabbing; }
.tile.arrastando { opacity: .4; }
/* Vencido: acento na borda esquerda em vez de badge. A informação aparece na
   varredura vertical sem competir com prioridade e prazo pela linha de meta. */
.tile.vencido { border-left: 3px solid var(--bad); }
.tile-titulo { font-weight: 550; margin-bottom: 7px; word-break: break-word; }
.tile-titulo.vazio { color: var(--sutil); font-style: italic; font-weight: 400; }
.tile-linha { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 600; padding: 1.5px 7px; border-radius: 5px; white-space: nowrap; }
.p-alta  { background: var(--p-alta-bg);  color: var(--p-alta); }
.p-media { background: var(--p-media-bg); color: var(--p-media); }
.p-baixa { background: var(--p-baixa-bg); color: var(--p-baixa); }
.pill.aguardando { background: var(--primary-soft); color: var(--primary-dark); }
.prazo { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prazo.atrasado { color: var(--bad); font-weight: 600; }
.delegado {
  margin-top: 7px; font-size: 11.5px; color: var(--s-delegado);
  background: var(--s-delegado-bg); padding: 2px 7px; border-radius: 5px; display: inline-block;
}
.coluna.alvo { border-color: var(--primary); background: var(--primary-soft); }
.coluna.alvo .coluna-corpo::after {
  content: ''; display: block; height: 46px; border: 2px dashed var(--primary);
  border-radius: var(--radius-sm); opacity: .5;
}

/* ============================ DASHBOARD ================================== */
.cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }
.cartao {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 15px; box-shadow: var(--shadow);
}
.cartao-num { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cartao-rot { font-size: 12px; color: var(--muted); margin-top: 1px; }
.cartao.alerta .cartao-num { color: var(--bad); }

.matriz { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.matriz th, .matriz td { padding: 9px 12px; text-align: center; border-bottom: 1px solid var(--border); }
.matriz thead th { font-size: 11.5px; font-weight: 600; color: var(--muted); text-align: center; }
.matriz tbody th { text-align: left; font-weight: 600; font-size: 13px; }
.matriz tr:last-child td, .matriz tr:last-child th { border-bottom: 0; }
.matriz .total { color: var(--muted); font-weight: 600; background: var(--bg); }
.matriz .zero { color: var(--sutil); }
/* Intensidade proporcional: a leitura que interessa é "onde a massa está", e cor faz
   isso mais rápido que número. O número continua lá para quem precisa do exato. */
.matriz .celula { font-weight: 600; border-radius: 6px; }

/* ============================ GANTT ====================================== */
.gantt { display: flex; overflow-x: auto; }
.gt-nomes { flex: none; width: 250px; border-right: 1px solid var(--border); background: var(--surface); }
.gt-tempo { flex: 1; min-width: 0; overflow-x: auto; }
.gt-canvas { position: relative; }
.gt-eixo { display: flex; height: 30px; border-bottom: 1px solid var(--border); }
.gt-eixo div {
  flex: none; font-size: 10.5px; color: var(--sutil); padding: 8px 0 0 5px;
  border-left: 1px solid var(--border); white-space: nowrap;
}
.gt-espaco { height: 30px; border-bottom: 1px solid var(--border); }
.gt-nome {
  height: 32px; display: flex; align-items: center; padding: 0 12px;
  border-bottom: 1px solid var(--border); font-size: 12.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
}
.gt-nome:hover { background: var(--bg); }
.gt-faixa { height: 32px; position: relative; border-bottom: 1px solid var(--border); }
.gt-nomes > :last-child, .gt-corpo > :last-child { border-bottom: 0; }
.gt-corpo { position: relative; }
.gt-grade { position: absolute; inset: 0; pointer-events: none; }
.gt-hoje { position: absolute; top: 30px; bottom: 0; width: 2px; background: var(--bad); z-index: 2; }
.gt-hoje b {
  position: absolute; top: -22px; left: -16px; font-size: 10px; color: #fff;
  background: var(--bad); padding: 1px 5px; border-radius: 4px; font-weight: 600;
}
.gt-bar { position: absolute; top: 8px; height: 16px; border-radius: 5px; display: flex; overflow: hidden; }
/* Dois segmentos: o tempo esperando e o tempo em execução. Sem isso o Gantt mostraria
   4 dos 20 ativos — `data_inicio` só é carimbada ao entrar em In progress. */
.gt-espera { background: repeating-linear-gradient(135deg, #e5e7eb 0 5px, #f3f4f6 5px 10px); }
.gt-exec-in-progress { background: var(--s-in-progress); }
.gt-exec-delegado    { background: var(--s-delegado); }
.gt-exec-not-started { background: var(--s-not-started); }
.gt-exec-sem-status  { background: var(--s-sem); }
.gt-bar.atrasada { box-shadow: 0 0 0 2px var(--bad); }
.gt-legenda { display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--muted); }
.gt-legenda i { width: 14px; height: 9px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 5px; }
/* Dois grupos de naturezas diferentes, separados por uma barra vertical: o primeiro filtra,
   o segundo só explica a cor. Misturá-los é o que fazia "clicar em esperando" não querer
   dizer nada. Ver `04`. */
.gt-legenda .grupo { display: flex; gap: 12px; align-items: center; }
.gt-legenda .grupo + .grupo { padding-left: 14px; border-left: 1px solid var(--border); }
.gt-legenda button {
  font: inherit; color: inherit; background: none; border: 0; padding: 2px 4px;
  border-radius: 5px; cursor: pointer; display: flex; align-items: center;
}
.gt-legenda button:hover { background: var(--bg); }
.gt-legenda button.off { opacity: .38; text-decoration: line-through; }
/* A régua é a área de arraste. O cursor diz isso antes do title. */
.gt-eixo { cursor: ew-resize; user-select: none; }
.gt-selecao {
  position: absolute; top: 0; height: 30px; z-index: 3; pointer-events: none;
  background: var(--primary-soft); border-left: 1px solid var(--primary);
  border-right: 1px solid var(--primary);
}
.gt-recorte {
  display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px;
  color: var(--primary-dark); background: var(--primary-soft);
  padding: 3px 9px; border-radius: 20px; font-weight: 500;
}
.gt-recorte button {
  font: inherit; font-weight: 600; color: inherit; background: none;
  border: 0; padding: 0; cursor: pointer; text-decoration: underline;
}

/* ============================ ANOTAÇÕES ================================== */
.pessoas-lista {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.pessoa-linha {
  display: grid; grid-template-columns: 190px 96px 1fr 116px; gap: 14px;
  align-items: center; padding: 11px 15px; border-bottom: 1px solid var(--border);
}
/* Resumos usa a mesma linha com quatro células. A coluna do total é só de Anotações —
   sem o modificador, o botão "Ler" cairia na coluna estreita do número. */
.pessoa-linha.com-total { grid-template-columns: 190px 96px 1fr 64px 116px; }
/* O total ganha coluna própria porque era a única informação da linha que exigia somar
   de cabeça. Mesmo vocabulário dos cartões do topo: número grande, rótulo pequeno. */
.total-notas { text-align: right; font-variant-numeric: tabular-nums; }
.total-notas b { font-size: 17px; font-weight: 650; display: block; line-height: 1.1; }
.total-notas span { font-size: 10.5px; color: var(--sutil); }
.total-notas.vazio-total b { color: var(--sutil); font-weight: 500; }
.pessoa-linha:last-child { border-bottom: 0; }
.pessoa-nome { font-weight: 550; }
.pessoa-nivel { font-size: 11px; color: var(--muted); }
.silencio { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.silencio.frio { color: var(--ok); }
.silencio.morno { color: var(--warn); }
.silencio.quente, .silencio.nunca { color: var(--bad); }
.barra { display: flex; height: 8px; border-radius: 20px; overflow: hidden; background: var(--bg); }
.barra span { display: block; }
.barra .b-pos { background: var(--ok); }

.contagens { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
/* O que o filtro de inativos tirou da vista, dito em voz baixa mas dito. Mesmo princípio
   do cabeçalho da coluna Done: esconder em silêncio é como a tela perde a confiança. */
.ocultos { font-weight: 400; color: var(--sutil); text-transform: none; letter-spacing: 0; }
.c-pos { color: var(--ok); font-weight: 600; }
.c-mel { color: var(--warn); font-weight: 600; }

.filtros { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filtros select {

  background: var(--surface); outline: none;
}
.filtros select:focus { border-color: var(--primary); }
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--muted);

.notas { display: flex; flex-direction: column; gap: 9px; }

/* ============================ LEITURA ==================================== */
/* O compilado é prosa longa e densa, lida antes de entrar numa conversa. Ele merece a
   tela inteira e nada em volta — mas com a linha curta, porque texto corrido de ponta a
   ponta do monitor é ilegível. Superfície cheia, medida confortável. */

/* Inativo só aparece no seletor quando já está no card — desenhado como resíduo, para

<div class="app" id="app">
