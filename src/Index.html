         tela no meio de uma conversa tira de vista justamente o trecho em discussão. */
      resumoAberto = { id: r.id, titulo: r.titulo, texto: r.texto, url: r.url };
      mostrarLeitura();

      /* `data_ultimo_1a1` mudou, e as duas telas o leem: o Hoje (fila de 1:1) e a lista de
         Resumos. Sem recarregar as duas, a fila continuaria cobrando a conversa que acabou
         de acontecer. */
      carregarPessoas();
      carregarResumos();
    })
    .withFailureHandler(function (err) {
      btn.textContent = 'Gravar';
      pintarDoca();
      /* O texto NÃO é limpo: o erro é para corrigir, não para recomeçar — e aqui o que
         foi digitado veio de uma conversa que já passou. */
      document.getElementById('erroDoca').innerHTML =
        '<div class="erro-form">' + esc(mensagem(err)) + '</div>';
    })
    /* `resumoAberto.id` direto, sem ternário: o guard no topo já garantiu que ele existe, e
       mandar '' aqui só produziria um ErroValidacao que a tela pode evitar. */
    .comentar1a1({
      pessoa_id: resumoPessoaId,
      texto: texto,
      resumo_id: resumoAberto.id
    });
}

function filtrarPessoa(v) { filtroPessoa = v; desenhar(); }
function filtrarTipo(v)   { filtroTipo = v; desenhar(); }
function filtrarValor(v)  { filtroValor = (filtroValor === v ? '' : v); desenhar(); }

/* ==========================================================================
   NOTAS — o recado solto
   --------------------------------------------------------------------------
   Não é a tela de Anotações, e a diferença é a razão de existirem duas. Lá o
   material é feedback: tem tipo, tem valor, vira compilado de 1:1. Aqui é o que
   ele quer reler depois e não julga nada — "Gustavo comentou que estava cansado",
   "Pessoa X gostaria de participar da demanda A".

   Por isso a tela não tem gráfico, contagem por tipo nem ranking: nota não se
   agrega, se relê. O que ela precisa é ser fácil de varrer e fácil de aposentar.
   ========================================================================== */

function htmlNotas() {
  if (erroNotas) {
    return '<div class="faixa"><div class="erro"><b>Não foi possível carregar as notas.</b>' +
      '<code>' + esc(erroNotas) + '</code></div></div>';
  }
  if (!notas) return '<p class="carregando">Carregando notas…</p>';

  var abertas = notasAbertas();
  var arquivadas = notas.length - abertas.length;
  var lista = notasArquivadas ? notas.filter(function (n) { return n.arquivada === true; }) : abertas;

  if (!notas.length) {
    return '<div class="pagina"><p class="vazio-msg">Nenhuma nota ainda. ' +
      'Use <b>Novo → Nota</b> para o recado que não é card nem feedback.</p></div>';
  }

  return '<div class="pagina">' +
      '<div class="secao">' +
        '<div class="notas-cab">' +
          '<div class="filtros">' +
            chipNotas(false, 'Abertas', abertas.length) +
            chipNotas(true, 'Arquivadas', arquivadas) +
          '</div>' +
        '</div>' +
        (lista.length ? htmlListaDeNotas(lista) : '<p class="vazio-msg">' +
          (notasArquivadas ? 'Nada arquivado ainda.' : 'Nenhuma nota aberta — tudo relido.') +
          '</p>') +
      '</div>' +
    '</div>';
}

function notasAbertas() {
  return notas ? notas.filter(function (n) { return n.arquivada !== true; }) : [];
}

function chipNotas(arquivadas, rotulo, n) {
  return '<button class="chip' + (notasArquivadas === arquivadas ? ' ativo' : '') +
    '" onclick="verNotas(' + arquivadas + ')">' + rotulo +
    '<span class="chip-n">' + n + '</span></button>';
}

function verNotas(arquivadas) { notasArquivadas = arquivadas; desenhar(); }

/**
 * Uma nota por cartão, agrupadas por dia.
 *
 * Agrupa por data porque é assim que a releitura acontece — "o que eu anotei na terça" —, e
 * uma lista corrida de trinta notas sem marco de dia obriga a ler a data de cada uma para
 * saber onde está.
 */
function htmlListaDeNotas(lista) {
  var grupos = [];
  var porData = {};

  lista.forEach(function (n) {
    var chave = n.data || '';
    if (!porData[chave]) { porData[chave] = []; grupos.push(chave); }
    porData[chave].push(n);
  });

  return '<div class="notas-lista">' + grupos.map(function (data) {
    return '<div class="notas-dia">' +
        '<p class="notas-dia-cab">' + (data ? rotuloDeDia(data) : 'sem data') + '</p>' +
        porData[data].map(htmlNota).join('') +
      '</div>';
  }).join('') + '</div>';
}

/* "hoje", "ontem", ou a data. Marco relativo é o que se lê de relance nos dois dias que
   importam; passado disso a data absoluta é mais útil que "há 9 dias". */
function rotuloDeDia(iso) {
  if (iso === hojeIso()) return 'hoje';
  if (iso === isoMenosDias(1)) return 'ontem';
  return fmtData(iso);
}

function htmlNota(n) {
  var pessoa = n.pessoa_id ? (pessoasPorId[n.pessoa_id] || null) : null;
  var card = n.card_id ? (cardsPorId[n.card_id] || null) : null;

  /* Id que não resolve aparece cru, como em todo o resto da tela: dado órfão escondido é
     problema que ninguém acha. */
  var ligacoes = '';
  if (n.pessoa_id) {
    ligacoes += '<span class="nota-lig pessoa' + (pessoa && !pessoa.ativo ? ' inativa' : '') + '">' +
      esc(pessoa ? pessoa.nome : n.pessoa_id) +
      (pessoa && !pessoa.ativo ? ' <em>inativo</em>' : '') + '</span>';
  }
  if (n.card_id) {
    ligacoes += '<span class="nota-lig card">' +
      esc(card ? (card.titulo || '(sem título)') : n.card_id) + '</span>';
  }

  var arquivada = n.arquivada === true;

  return '<div class="nota' + (arquivada ? ' arquivada' : '') + '">' +
      '<div class="nota-texto">' + esc(n.texto) + '</div>' +
      (ligacoes ? '<div class="nota-ligacoes">' + ligacoes + '</div>' : '') +
      '<button class="nota-acao" onclick="alternarArquivoDaNota(\'' + esc(n.id) + '\', ' +
        (!arquivada) + ')" title="' +
        (arquivada ? 'Trazer de volta para as abertas' : 'Arquivar — sai da lista, fica na planilha') +
        '">' + (arquivada ? '&#8630; reabrir' : '&#10003; arquivar') + '</button>' +
    '</div>';
}

function alternarArquivoDaNota(id, arquivar) {
  google.script.run
    .withSuccessHandler(function () { carregarNotas(); })
    .withFailureHandler(function (err) {
      document.getElementById('aviso').innerHTML =
        '<div class="aviso">Não foi possível arquivar: ' + esc(mensagem(err)) + '</div>';
    })
    .arquivarNota(id, arquivar);
}

/* ==========================================================================
   PESSOAS — o time
   --------------------------------------------------------------------------
   A tela que faltava. `ativo` é a coluna que decide quem aparece em todas as
   outras, e até aqui ela só podia ser marcada à mão na planilha — junto com o
   `id`, que precisa ser UUID porque é o alvo de todas as FKs.

   Duas listas, e a separação é o conteúdo: em cima quem está no time, embaixo
   quem saiu. Quem saiu **continua aqui**, e é a única tela que o mostra: as
   outras escondem inativo porque falam de atenção, esta fala do cadastro.
   ========================================================================== */

function htmlPessoas() {
  if (erroPessoas) {
    return '<div class="faixa"><div class="erro"><b>Não foi possível carregar as pessoas.</b>' +
      '<code>' + esc(erroPessoas) + '</code></div></div>';
  }
  if (!pessoasCarregadas) return '<p class="carregando">Carregando pessoas…</p>';

  var inativos = pessoas.filter(function (p) { return !p.ativo; });

  if (!pessoas.length) {
    return '<div class="pagina"><p class="vazio-msg">Ninguém cadastrado ainda. ' +
      'Use <b>Novo → Pessoa</b> — é o que destrava anotação, 1:1 e delegação, ' +
      'que todos apontam para esta aba.</p></div>';
  }

  return '<div class="pagina">' +
      '<div class="secao">' +
        '<p class="secao-titulo">No time' +
          '<span class="secao-num">' + pessoasAtivas.length + '</span></p>' +
        (pessoasAtivas.length
          ? '<div class="painel"><div class="linhas">' +
              pessoasAtivas.map(htmlPessoa).join('') + '</div></div>'
          : '<p class="vazio-msg">Ninguém ativo — o app inteiro fica vazio assim. ' +
            'Reative alguém abaixo, ou cadastre.</p>') +
      '</div>' +

      /* O bloco de quem saiu só existe quando há quem tenha saído: uma seção "Fora do
         time — 0" seria ruído permanente numa tela que já é a menos visitada. */
      (inativos.length
        ? '<div class="secao">' +
            '<p class="secao-titulo">Fora do time' +
              '<span class="secao-num">' + inativos.length + '</span></p>' +
            '<p class="vazio-msg">Continuam aqui porque o nome deles ainda traduz as ' +
              'anotações antigas e os cards que ficaram. Não escrevem nem entram em 1:1.</p>' +
            '<div class="painel"><div class="linhas">' +
              inativos.map(htmlPessoa).join('') + '</div></div>' +
          '</div>'
        : '') +
    '</div>';
}

function htmlPessoa(p) {
  var acao = p.ativo ? 'Desativar' : 'Reativar';

  /* Card ainda delegado a quem está saindo é o caso que o `04` descreve: ele NÃO some da
     tela junto com a pessoa, porque é exatamente o card que precisa de outro dono. Dizer
     isso aqui, ao lado do botão, é o que transforma a desativação numa decisão informada
     em vez de uma surpresa três dias depois. */
  var pendentes = cardsDelegadosA(p.id).length;

  var meta = '';
  if (p.nivel) meta += '<span class="pess-nivel">' + esc(p.nivel) + '</span>';
  if (p.ativo && pendentes) {
    meta += '<span class="pess-alerta">' + pendentes +
      (pendentes === 1 ? ' card delegado' : ' cards delegados') + '</span>';
  }
  meta += '<span class="pess-1a1">' + (p.data_ultimo_1a1
    ? '1:1 em ' + fmtData(p.data_ultimo_1a1)
    : 'sem 1:1 registrado') + '</span>';

  return '<div class="linha pess' + (p.ativo ? '' : ' inativa') + '">' +
      '<span class="txt">' + esc(p.nome) + '</span>' + meta +
      '<button class="pess-btn" onclick="editarPessoa(\'' + esc(p.id) + '\')">Editar</button>' +
      '<button class="pess-btn" onclick="alternarAtivo(\'' + esc(p.id) + '\')">' + acao + '</button>' +
    '</div>';
}

/** Cards ativos delegados a esta pessoa. `delegado_para` é FK multivalor, separada por vírgula. */
function cardsDelegadosA(pessoaId) {
  return ativos().filter(function (c) {
    return idsDeCsv(c.delegado_para).indexOf(pessoaId) >= 0;
  });
}

/* ------------------------------- o modal ---------------------------------- */

function abrirModalPessoa() {
  pessoaEmEdicao = null;
  prepararModalPessoa('Nova pessoa', 'Cadastrar', '');
}

function editarPessoa(id) {
  var p = pessoasPorId[id];
  if (!p) return;

  pessoaEmEdicao = id;
  prepararModalPessoa('Editar pessoa', 'Salvar',
    'Cadastrada em ' + fmtDataHora(p.criado_em) + (p.ativo ? '' : ' · fora do time'));

  document.getElementById('p-nome').value = p.nome || '';
  document.getElementById('p-nivel').value = p.nivel || '';
}

function prepararModalPessoa(titulo, rotulo, carimbos) {
  document.getElementById('erroPessoa').innerHTML = '';
  document.getElementById('formPessoa').reset();
  document.getElementById('tituloModalPessoa').textContent = titulo;
  document.getElementById('carimbosPessoa').textContent = carimbos;

  /* A lista fechada vem do schema pelo servidor, e o vazio é uma opção de verdade: nem
     todo cadastro sabe o nível no dia, e a camada aceita vazio. */
  document.getElementById('p-nivel').innerHTML =
    '<option value="">— sem nível —</option>' + NIVEIS.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
    }).join('');

  botaoSalvarPessoa(false, rotulo);
  document.getElementById('overlayPessoa').classList.add('aberto');
  document.getElementById('p-nome').focus();
}

function fecharModalPessoa() {
  document.getElementById('overlayPessoa').classList.remove('aberto');
}

function cliqueForaFechaPessoa(ev) {
  if (ev.target.id === 'overlayPessoa') fecharModalPessoa();
}

function salvarPessoa(ev) {
  ev.preventDefault();
  var editando = !!pessoaEmEdicao;
  var rotulo = editando ? 'Salvar' : 'Cadastrar';
  botaoSalvarPessoa(true, rotulo);
  document.getElementById('erroPessoa').innerHTML = '';

  var campos = {
    nome: document.getElementById('p-nome').value,
    nivel: document.getElementById('p-nivel').value
  };

  var chamada = google.script.run
    .withSuccessHandler(function () {
      botaoSalvarPessoa(false, rotulo);
      fecharModalPessoa();
      carregarPessoas();   // ela redesenha a tela ao terminar
    })
    .withFailureHandler(function (err) {
      botaoSalvarPessoa(false, rotulo);
      document.getElementById('erroPessoa').innerHTML =
        '<div class="erro-form">' + esc(mensagem(err)) + '</div>';
    });

  /* `ativo` NÃO vai no patch da edição: quem liga e desliga é o botão da lista, onde o
     rótulo diz o que vai acontecer. Mandá-lo daqui faria o formulário reafirmar um estado
     que ele não mostra, e uma edição de nível reativaria alguém sem querer. */
  if (editando) chamada.updatePessoa(pessoaEmEdicao, campos);
  else chamada.createPessoa(campos);
}

function botaoSalvarPessoa(ocupado, rotulo) {
  var btn = document.getElementById('btnSalvarPessoa');
  btn.disabled = ocupado;
  btn.textContent = ocupado ? 'Salvando…' : rotulo;
}

/**
 * Liga e desliga o `ativo`.
 *
 * Confirma antes de desativar, e **não** antes de reativar: desativar tira a pessoa das
 * telas de atenção e faz a camada recusar anotação e 1:1 para ela, enquanto reativar só
 * devolve o que havia. Confirmação nas duas pontas ensinaria a clicar em "ok" sem ler.
 */
function alternarAtivo(id) {
  var p = pessoasPorId[id];
  if (!p) return;

  if (p.ativo) {
    var pendentes = cardsDelegadosA(id).length;
    var aviso = 'Desativar ' + p.nome + '?\n\n' +
      'O nome continua traduzindo as anotações e os cards antigos. ' +
      'O que muda: sai das telas de atenção, e a camada passa a recusar anotação e 1:1.';
    if (pendentes) {
      aviso += '\n\nAtenção: ' + pendentes + (pendentes === 1 ? ' card segue delegado' : ' cards seguem delegados') +
        ' a ela, e vão continuar aparecendo com o nome dela — é o que lembra de dar outro dono.';
    }
    if (!window.confirm(aviso)) return;
  }

  google.script.run
    .withSuccessHandler(function () { carregarPessoas(); })
    .withFailureHandler(function (err) {
      document.getElementById('aviso').innerHTML =
        '<div class="aviso">Não foi possível alterar: ' + esc(mensagem(err)) + '</div>';
    })
    .updatePessoa(id, { ativo: !p.ativo });
}

/* ==========================================================================
   LOG DA INGESTÃO
   --------------------------------------------------------------------------
   A metade invisível do sistema. Toda captura de skill confirma ANTES de ser
   validada — a skill grava o arquivo e diz "anotado", e quem valida é o
   processarInbox, até 10 minutos depois. Quando falha, o fracasso ficava aqui e
   em `erros/`, e a tela não dizia nada.

   Falhas primeiro, rolagem depois: dump cronológico obrigaria a caçar o erro no
   meio do que deu certo, e é o erro que traz alguém a esta aba.
   ========================================================================== */

function htmlLog() {
  if (erroLog) {
    return '<div class="faixa"><div class="erro"><b>Não foi possível ler o Log.</b>' +
      '<code>' + esc(erroLog) + '</code></div></div>';
  }
  if (!log) return '<p class="carregando">Carregando log…</p>';

  var cartao = function (num, rotulo, alerta) {
    return '<div class="cartao' + (alerta && num ? ' alerta' : '') + '">' +
      '<div class="cartao-num">' + num + '</div><div class="cartao-rot">' + rotulo + '</div></div>';
  };

  /* O botão só aparece quando há o que marcar. Botão permanente que às vezes não faz nada
     ensina a ignorá-lo, e este precisa ser notado no dia em que importa. */
  var marcar = log.naoVistos
    ? '<button class="btn" onclick="marcarLogComoVisto()" id="btnLogVisto" ' +
      'title="Zera o contador do menu. As falhas continuam na lista.">' +
      'Marcar ' + log.naoVistos + ' como visto</button>'
    : '';

  var vistoEm = log.vistoAte
    ? '<p class="log-visto">Conferido até ' + fmtDataHora(log.vistoAte) + '.</p>'
    : '';

  return '<div class="pagina">' +
    '<div class="secao"><div class="cartoes">' +
      cartao(log.naoVistos, 'não vistas', true) +
      cartao(log.erros, 'falharam em ' + log.dias + 'd') +
      cartao(log.ok, 'entraram') +
      cartao(log.ignorados, 'já processados') +
      cartao(log.naJanela, 'arquivos') +
    '</div>' + (marcar ? '<div class="log-acoes">' + marcar + '</div>' : '') + vistoEm + '</div>' +
    htmlLogFalhas() +
    htmlLogRolagem() +
  '</div>';
}

/**
 * Zera o contador do menu — e **não** esconde nada da lista.
 *
 * O caso que motivou: os arquivos foram corrigidos e reprocessados, a pasta `erros/` está
 * vazia, e as linhas antigas do Log continuavam marcando 4 no menu. O que estava errado era
 * o contador significar "erros na janela", um número que só envelhece. Agora ele significa
 * "falhas que eu ainda não vi", que uma ação zera — e falha nova levanta de novo, sozinha.
 */
function marcarLogComoVisto() {
  var btn = document.getElementById('btnLogVisto');
  if (btn) { btn.disabled = true; btn.textContent = 'Marcando…'; }

  google.script.run
    .withSuccessHandler(function () { carregarLog(); })
    .withFailureHandler(function (err) {
      carregarLog();
      document.getElementById('aviso').innerHTML =
        '<div class="aviso">Não foi possível marcar como visto: ' + esc(mensagem(err)) + '</div>';
    })
    .marcarLogVisto();
}

/**
 * O que falhou, com a mensagem inteira.
 *
 * A mensagem não é truncada: ela é o produto desta tela. `ErroValidacao: "tipo" =
 * "ponto_forte" não está na lista` diz exatamente o que corrigir, e cortá-la em 60
 * caracteres devolveria o usuário à pasta de erros do Drive.
 */
function htmlLogFalhas() {
  var falhas = log.linhas.filter(function (l) { return l.resultado === 'erro'; });

  if (!falhas.length) {
    return '<div class="secao"><p class="secao-titulo">Falhas</p>' +
      '<p class="vazio-msg">Nenhuma captura falhou nos últimos ' + log.dias + ' dias.</p></div>';
  }

  return '<div class="secao"><p class="secao-titulo">Falhas' +
      '<span class="secao-num">' + falhas.length + '</span></p>' +
    '<div class="log-falhas">' + falhas.map(function (l) {
      return '<div class="log-falha">' +
          '<div class="log-falha-cab">' +
            '<b>' + esc(l.arquivo || '(sem nome)') + '</b>' +
            '<span class="log-quando">' + fmtDataHora(l.quando) + '</span>' +
          '</div>' +
          '<div class="log-msg">' + esc(l.mensagem || '(sem mensagem)') + '</div>' +
        '</div>';
    }).join('') + '</div>' +
    '<p class="log-dica">O arquivo está na pasta <b>erros</b> do Drive. Corrigir o campo ' +
      'e movê-lo de volta para <b>inbox</b> refaz a entrada — a dedupe é por arquivo, ' +
      'então nada duplica.</p>' +
  '</div>';
}

/** A rolagem completa da janela, para auditar o que entrou. */
function htmlLogRolagem() {
  if (!log.linhas.length) {
    return '<div class="secao"><p class="secao-titulo">Movimento</p>' +
      '<p class="vazio-msg">Nada processado nos últimos ' + log.dias + ' dias. ' +
      (log.total ? 'A aba tem ' + log.total + ' linha(s) mais antigas.' : 'A aba está vazia.') +
      '</p></div>';
  }

  var corte = log.cortadas
    ? ocultos(log.cortadas, 'teto de ' + LOG_MAX_LINHAS_UI + ' linhas por carga')
    : '';

  return '<div class="secao"><p class="secao-titulo">Movimento' +
      '<span class="secao-num">' + log.linhas.length + '</span>' + corte + '</p>' +
    '<div class="log-lista">' + log.linhas.map(function (l) {
      return '<div class="log-linha">' +
          '<span class="pill log-' + esc(l.resultado || 'sem') + '">' +
            esc(l.resultado || '—') + '</span>' +
          '<span class="log-arquivo">' + esc(l.arquivo || '(sem nome)') + '</span>' +
          '<span class="log-tipo">' + esc(l.tipo || '—') + '</span>' +
          '<span class="log-quando">' + fmtDataHora(l.quando) + '</span>' +
        '</div>';
    }).join('') + '</div>' +
  '</div>';
}

/* ==========================================================================
   UTILITÁRIOS
   ========================================================================== */
/* Título e demais textos vêm da planilha — nada entra no DOM sem escapar. */
function esc(valor) {
  var mapa = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(valor == null ? '' : valor).replace(/[&<>"']/g, function (ch) { return mapa[ch]; });
}

function mensagem(err) { return err && err.message ? err.message : String(err); }

/* ISO → dd/mm/yyyy por fatiamento de string. Nada de new Date(iso): o parser trataria
   "2026-08-02" como UTC e, em fuso negativo, exibiria 01/08. */
function fmtData(iso) {
  var partes = String(iso).slice(0, 10).split('-');
  return partes.length === 3 ? partes[2] + '/' + partes[1] + '/' + partes[0] : '';
}

function fmtDataHora(iso) {
  if (!iso) return '—';
  var hora = String(iso).slice(11, 16);
  return hora ? fmtData(iso) + ' às ' + hora : fmtData(iso);
}

function fmtDiaMes(ms) {
  var d = new Date(ms);
  return dois(d.getUTCDate()) + '/' + dois(d.getUTCMonth() + 1);
}

/* Comparação de prazo é feita entre strings ISO, que ordenam sozinhas — assim nenhuma
   data do contrato precisa passar por new Date() e por um fuso. */
function hojeIso() {
  var d = new Date();
  return d.getFullYear() + '-' + dois(d.getMonth() + 1) + '-' + dois(d.getDate());
}

function isoMenosDias(dias) { return isoMaisDias(-dias); }

function isoMaisDias(dias) {
  var d = new Date();
  d.setDate(d.getDate() + dias);
  return d.getFullYear() + '-' + dois(d.getMonth() + 1) + '-' + dois(d.getDate());
}

/* ISO → milissegundos em UTC. O Gantt só compara e posiciona datas entre si, então UTC
   evita que horário de verão encolha ou estique um dia no meio da escala. */
function msDeIso(iso) {
  var p = String(iso).slice(0, 10).split('-');
  return p.length === 3 ? Date.UTC(p[0], p[1] - 1, p[2]) : NaN;
}

/* Diferença em dias. Mesmo motivo do msDeIso: subtrair dois horários locais pode dar
   23 ou 25 horas e truncar para o dia errado. */
function diasEntre(isoA, isoB) {
  var a = msDeIso(isoA), b = msDeIso(isoB);
  return isNaN(a) || isNaN(b) ? null : Math.round((b - a) / MS_DIA);
}

function dois(n) { return (n < 10 ? '0' : '') + n; }

/* "id1,id2" → "Lucas, Viviane". Id que não resolve aparece como está, em vez de sumir:
   dado órfão visível é problema; dado órfão escondido é problema que ninguém acha. */
function nomesDeIds(csv) {
  return idsDeCsv(csv)
    .map(function (id) { return pessoasPorId[id] ? pessoasPorId[id].nome : id; })
    .join(', ');
}

function idsDeCsv(csv) {
  return String(csv || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
}

function idsMarcadosEm(seletor) {
  return Array.prototype.slice.call(document.querySelectorAll(seletor + ' input:checked'))
    .map(function (el) { return el.value; }).join(',');
}

function marcarNo(seletor, csv) {
  var marcados = idsDeCsv(csv);
  Array.prototype.slice.call(document.querySelectorAll(seletor + ' input'))
    .forEach(function (el) { el.checked = marcados.indexOf(el.value) >= 0; });
}

/* ==========================================================================
   SINCRONIZAÇÃO (inbox do Drive)
   ========================================================================== */
function sincronizar() {
  botaoSincronizar(true);
  document.getElementById('avisoSync').innerHTML = '';

  google.script.run
    .withSuccessHandler(aoSincronizar)
    .withFailureHandler(aoFalharSincronizar)
    .processarInbox();
}

function aoSincronizar(r) {
  botaoSincronizar(false);
  document.getElementById('avisoSync').innerHTML =
    '<div class="aviso' + (r.erros ? '' : ' ok') + '">' + esc(resumoDaSincronia(r)) + '</div>';

  /* A sincronia cria card e anotação: recarrega os dois, senão a tela continua mostrando
     um retrato de antes do que acabou de entrar. */
  recarregarTudo();
}

function aoFalharSincronizar(err) {
  botaoSincronizar(false);
  document.getElementById('avisoSync').innerHTML =
    '<div class="aviso">Não foi possível sincronizar: ' + esc(mensagem(err)) + '</div>';
}

function resumoDaSincronia(r) {
  if (r.ocupado) {
    return 'Uma sincronização já estava em andamento — nada foi feito agora. ' +
           'Tente de novo em alguns segundos.';
  }

  var total = r.processados + r.ignorados + r.erros;
  if (!total) return 'Inbox vazio — nenhum arquivo para processar.';

  var partes = [r.processados + (r.processados === 1 ? ' registro criado' : ' registros criados')];
  if (r.ignorados) partes.push(r.ignorados + ' já processado(s) antes');
  if (r.erros) partes.push(r.erros + ' com erro (ver a pasta erros/ e a aba Log)');

  var texto = partes.join(' · ') + '.';
  /* Teto por rodada é limite real, não detalhe interno: sem dizer, "3 criados" passaria a
     impressão de que o inbox esvaziou. */
  if (r.restantes) texto += ' Ainda há arquivos no inbox — sincronize de novo.';
  return texto;
}

function botaoSincronizar(ocupado) {
  var btn = document.getElementById('btnSincronizar');
  btn.disabled = ocupado;
  btn.innerHTML = '<span>' + (ocupado ? 'Sincronizando…' : 'Sincronizar') + '</span>';
}

/* ==========================================================================
   CRIAÇÃO E EDIÇÃO
   ========================================================================== */
/* Campos que o formulário expõe. `notion_id` fica de fora: nasce vazio e só é preenchido
   na migração. Os gerados pela camada nem chegam a ser mencionados — o servidor recusa o
   payload se vierem. As três datas de transição também não: quem carimba é a camada. */
var CAMPOS_FORM = [
  'titulo', 'status', 'prioridade', 'prazo', 'descricao',
  'aguardando_cliente', 'prazo_cliente', 'pendencia_cliente', 'delegado_para'
];

function carregarPessoas() {
  google.script.run
    .withSuccessHandler(function (lista) {
      pessoas = lista || [];
      pessoasAtivas = pessoas.filter(function (p) { return p.ativo; });
      pessoasPorId = {};
      pessoas.forEach(function (p) { pessoasPorId[p.id] = p; });
      pessoasCarregadas = true;
      erroPessoas = '';
      montarSeletorDePessoas('');
      /* A tela traduz id→nome e calcula a fila de 1:1; se as pessoas chegaram depois
         dos cards, redesenha. É também o que devolve a tela Pessoas atualizada depois de
         um cadastro ou de uma (des)ativação — sem segunda chamada e sem estado paralelo. */
      desenhar();
    })
    .withFailureHandler(function (err) {
      erroPessoas = mensagem(err);
      document.getElementById('f-delegado_para').innerHTML =
        '<span class="vazio">Pessoas indisponível: ' + esc(erroPessoas) + '</span>';
      /* Sem isto a tela Pessoas ficaria em "Carregando…" para sempre — o seletor do modal
         de card avisa, mas ele não está à vista de quem abriu esta aba. */
      if (visao === 'pessoas') desenhar();
    })
    .listPessoas();
}

function montarSeletorDePessoas(jaNoCard) {
  document.getElementById('f-delegado_para').innerHTML = caixasDePessoas(jaNoCard);
}

/**
 * As caixas de um seletor de pessoas: **ativos, mais quem já está no card.**
 *
 * O "mais quem já está" não é cortesia — é o que impede perda de dado. O seletor devolve
 * quem estiver marcado, então um card delegado a alguém que saiu do time perderia essa
 * pessoa no primeiro salvamento, sem ninguém pedir e sem nada avisar. Ela volta marcada,
 * desenhada como resíduo, e desmarcá-la é uma decisão explícita.
 *
 * Id que não resolve em pessoa nenhuma também entra, pelo mesmo motivo de o resto da tela
 * mostrar id órfão em vez de escondê-lo.
 */
function caixasDePessoas(jaNoCard) {
  var presentes = idsDeCsv(jaNoCard);

  var extras = presentes
    .filter(function (id) {
      return !pessoasAtivas.some(function (p) { return p.id === id; });
    })
    .map(function (id) {
      return pessoasPorId[id] || { id: id, nome: id };
    });

  var lista = pessoasAtivas.concat(extras);
  if (!lista.length) return '<span class="vazio">Nenhuma pessoa ativa cadastrada.</span>';

  return lista.map(function (p) {
    var inativa = extras.indexOf(p) >= 0;
    return '<label' + (inativa ? ' class="inativa"' : '') + '>' +
        '<input type="checkbox" value="' + esc(p.id) + '">' + esc(p.nome) +
        (inativa ? ' <em>inativo</em>' : '') +
      '</label>';
  }).join('');
}

/* Selects vêm das listas do servidor — as mesmas que validam do outro lado. */
function popularSelects() {
  document.getElementById('f-status').innerHTML = STATUS_COLUNAS.map(function (s) {
    return '<option value="' + esc(s) + '"' + (s === STATUS_PADRAO_UI ? ' selected' : '') +
           '>' + esc(s) + '</option>';
  }).join('');

  document.getElementById('f-prioridade').innerHTML =
    '<option value="">—</option>' + PRIORIDADES.map(function (p) {
      return '<option value="' + esc(p) + '">' + esc(p) + '</option>';
    }).join('');
}

function abrirModal() {
  idEmEdicao = null;
  prepararModal('Novo card', '');
  /* Remontado a cada abertura: card novo só oferece ativos, e a montagem já nasce
     desmarcada — reset() do form não desmarca checkbox criado por JS. */
  montarSeletorDePessoas('');
}

/* Abre o mesmo modal preenchido com o card. Os valores vêm da última carga: o servidor já
   entregou tudo no formato que os campos usam, inclusive as datas em yyyy-MM-dd. */
function abrirEdicao(id) {
  var card = cardsPorId[id];
  if (!card) return;

  idEmEdicao = id;
  prepararModal('Editar card',
    'Criado em ' + fmtDataHora(card.criado_em) +
    '<br>Atualizado em ' + fmtDataHora(card.atualizado_em));

  CAMPOS_FORM.forEach(function (campo) {
    /* Remonta antes de marcar: quem já está no card entra na lista mesmo inativo, senão
       a caixa não existiria e o salvamento apagaria a delegação. */
    if (campo === 'delegado_para') {
      montarSeletorDePessoas(card.delegado_para);
      return marcarNo('#f-delegado_para', card.delegado_para);
    }
    var el = document.getElementById('f-' + campo);
    if (el.type === 'checkbox') el.checked = card[campo] === true;
    else el.value = card[campo] || '';
  });
}

function prepararModal(titulo, carimbos) {
  document.getElementById('erroForm').innerHTML = '';
  document.getElementById('formCard').reset();
  document.getElementById('tituloModal').textContent = titulo;
  document.getElementById('carimbos').innerHTML = carimbos;
  botaoSalvar(false);
  document.getElementById('overlay').classList.add('aberto');
  document.getElementById('f-titulo').focus();
}

function fecharModal() {
  document.getElementById('overlay').classList.remove('aberto');
}

function cliqueForaFecha(ev) {
  if (ev.target.id === 'overlay') fecharModal();
}

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') {
    fecharModal(); fecharModalAnotacao(); fecharModalPessoa();
    cancelarDelegacao(); fecharResumo();
    return;
  }

  /* "/" foca a busca, como em quase todo app de lista. Não sequestra a tecla enquanto
     alguém está digitando em outro campo. */
  var alvo = ev.target.tagName;
  if (ev.key === '/' && alvo !== 'INPUT' && alvo !== 'TEXTAREA' && visao === 'board') {
    ev.preventDefault();
    document.getElementById('busca').focus();
  }
});

/* input[type=date] já entrega yyyy-MM-dd — o formato de transporte do contrato. */
function montarPayload() {
  var payload = {};
  CAMPOS_FORM.forEach(function (campo) {
    if (campo === 'delegado_para') { payload[campo] = idsMarcadosEm('#f-delegado_para'); return; }
    var el = document.getElementById('f-' + campo);
    payload[campo] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return payload;
}

function salvar(ev) {
  ev.preventDefault();
  /* Metade da defesa contra escrita duplicada; a outra é o LockService no servidor. */
  botaoSalvar(true);
  document.getElementById('erroForm').innerHTML = '';

  var runner = google.script.run
    .withSuccessHandler(aoSalvar)
    .withFailureHandler(aoFalharSalvar);

  /* O formulário manda os nove campos sempre, então a edição sobrescreve todos eles —
     inclusive apagando os que ficaram em branco, que é a convenção de patch do contrato. */
  if (idEmEdicao) runner.updateCard(idEmEdicao, montarPayload());
  else runner.createCard(montarPayload());
}

function aoSalvar() {
  botaoSalvar(false);
  fecharModal();
  carregar();
}

/* Modal continua aberto com o que foi digitado: o erro é para corrigir, não para recomeçar. */
function aoFalharSalvar(err) {
  botaoSalvar(false);
  document.getElementById('erroForm').innerHTML =
    '<div class="erro-form">' + esc(mensagem(err)) + '</div>';
}

function botaoSalvar(ocupado) {
  var btn = document.getElementById('btnSalvar');
  btn.disabled = ocupado;
  btn.textContent = ocupado ? 'Salvando…' : (idEmEdicao ? 'Salvar' : 'Criar card');
}

/* ==========================================================================
   FORMULÁRIO DE ANOTAÇÃO

   O mesmo caminho da skill, pela porta do front: `createAnotacao` é a mesma
   função que o `processarInbox` chama depois de traduzir o envelope. A diferença
   é que aqui não há intermediário — o erro de validação volta no formulário, em
   vez de na aba Log dez minutos depois.
   ========================================================================== */

function abrirModalAnotacao() {
  document.getElementById('erroAnotacao').innerHTML = '';
  document.getElementById('formAnotacao').reset();

  /* Só ativos, e sem o "mais quem já está" do seletor de card: anotação nasce agora, e
     registrar feedback de quem saiu do time é o que a camada recusa de propósito. */
  document.getElementById('a-pessoa_id').innerHTML =
    '<option value="">—</option>' + pessoasAtivas.map(function (p) {
      return '<option value="' + esc(p.id) + '">' + esc(p.nome) + '</option>';
    }).join('');

  /* Remontado a cada abertura, como o de delegado: reset() não desmarca checkbox que o
     JS criou. */
  document.getElementById('a-valores').innerHTML = VALORES.map(function (v) {
    return '<label><input type="checkbox" value="' + esc(v.campo) + '">' +
      esc(v.rotulo) + '</label>';
  }).join('');

  botaoSalvarAnotacao(false);
  document.getElementById('overlayAnotacao').classList.add('aberto');
  document.getElementById('a-pessoa_id').focus();
}

function fecharModalAnotacao() {
  document.getElementById('overlayAnotacao').classList.remove('aberto');
}

function cliqueForaFechaAnotacao(ev) {
  if (ev.target.id === 'overlayAnotacao') fecharModalAnotacao();
}

function salvarAnotacao(ev) {
  ev.preventDefault();
  botaoSalvarAnotacao(true);
  document.getElementById('erroAnotacao').innerHTML = '';

  google.script.run
    .withSuccessHandler(aoSalvarAnotacao)
    .withFailureHandler(aoFalharSalvarAnotacao)
    .createAnotacao(montarPayloadDeAnotacao());
}

/**
 * Payload no formato do schema, e não do envelope.
 *
 * A tradução `tipo_nota`→`tipo` e `valores[]`→booleanos existe na borda da ingestão porque
 * a skill fala a língua da captura. O front não precisa dela: fala direto o `01`, que é o
 * que o `createAnotacao` espera. Mandar o envelope daqui seria inventar um dialeto a mais.
 */
function montarPayloadDeAnotacao() {
  var payload = {
    pessoa_id: document.getElementById('a-pessoa_id').value,
    nota: document.getElementById('a-nota').value,
    tipo: document.getElementById('a-tipo').value,
    contexto: document.getElementById('a-contexto').value,
    data: document.getElementById('a-data').value
  };

  /* Todos os quatro sempre, e não só os marcados: é a mesma convenção da ingestão — mandar
     os valores declara o conjunto inteiro, então o que não veio é `false` e não "não mexi". */
  var marcados = idsDeCsv(idsMarcadosEm('#a-valores'));
  VALORES.forEach(function (v) {
    payload[v.campo] = marcados.indexOf(v.campo) >= 0;
  });

  return payload;
}

function aoSalvarAnotacao() {
  botaoSalvarAnotacao(false);
  fecharModalAnotacao();
  /* Em silêncio: a tela de Anotações já está montada, e trocá-la por "carregando" para
     acrescentar uma linha piora o que funciona. */
  carregarAnotacoesEmSilencio();
}

function aoFalharSalvarAnotacao(err) {
  botaoSalvarAnotacao(false);
  document.getElementById('erroAnotacao').innerHTML =
    '<div class="erro-form">' + esc(mensagem(err)) + '</div>';
}

function botaoSalvarAnotacao(ocupado) {
  var btn = document.getElementById('btnSalvarAnotacao');
  btn.disabled = ocupado;
  btn.textContent = ocupado ? 'Salvando…' : 'Criar anotação';
}

/* ==========================================================================
   FORMULÁRIO DE NOTA

   O recado solto. As duas ligações começam vazias porque o caso normal é nota
   sem nenhuma — "lembrar de revisar o processo de deploy" não é sobre ninguém.
   ========================================================================== */

function abrirModalRecado() { abrirModalNota(); }

function abrirModalNota() {
  document.getElementById('erroNota').innerHTML = '';
  document.getElementById('formNota').reset();

  /* Todas as pessoas, não só as ativas: nota sobre quem acabou de sair do time é legítima
     ("X pediu demissão"), e a camada aceita — é a diferença deliberada em relação ao
     createAnotacao, que exige pessoa ativa. Inativo aparece marcado. */
  document.getElementById('n-pessoa_id').innerHTML =
    '<option value="">— nenhuma —</option>' + pessoas.map(function (p) {
      return '<option value="' + esc(p.id) + '">' + esc(p.nome) +
        (p.ativo ? '' : ' (inativo)') + '</option>';
    }).join('');

  /* Só cards ativos: nota nova sobre demanda concluída é caso raro, e a lista inteira com
     o histórico de Done tornaria o select inútil de rolar. */
  document.getElementById('n-card_id').innerHTML =
    '<option value="">— nenhuma —</option>' + ativos()
      .slice()
      .sort(function (a, b) {
        return String(a.titulo || '').localeCompare(String(b.titulo || ''), 'pt-BR');
      })
      .map(function (c) {
        return '<option value="' + esc(c.id) + '">' + esc(c.titulo || '(sem título)') + '</option>';
      }).join('');

  botaoSalvarNota(false);
  document.getElementById('overlayNota').classList.add('aberto');
  document.getElementById('n-texto').focus();
}

function fecharModalNota() {
  document.getElementById('overlayNota').classList.remove('aberto');
}

function cliqueForaFechaNota(ev) {
  if (ev.target.id === 'overlayNota') fecharModalNota();
}

function salvarNota(ev) {
  ev.preventDefault();
  botaoSalvarNota(true);
  document.getElementById('erroNota').innerHTML = '';

  google.script.run
    .withSuccessHandler(function () {
      botaoSalvarNota(false);
      fecharModalNota();
      carregarNotas();
      /* Se a aba aberta não é Notas, o contador do menu ainda precisa subir. */
      if (visao !== 'notas') atualizarSino();
    })
    .withFailureHandler(function (err) {
      botaoSalvarNota(false);
      document.getElementById('erroNota').innerHTML =
        '<div class="erro-form">' + esc(mensagem(err)) + '</div>';
    })
    .createNota({
      texto: document.getElementById('n-texto').value,
      pessoa_id: document.getElementById('n-pessoa_id').value,
      card_id: document.getElementById('n-card_id').value,
      data: document.getElementById('n-data').value
    });
}

function botaoSalvarNota(ocupado) {
  var btn = document.getElementById('btnSalvarNota');
  btn.disabled = ocupado;
  btn.textContent = ocupado ? 'Salvando…' : 'Criar nota';
}

popularSelects();
pintarBotaoTema();
carregarPessoas();
carregar();
carregarAgenda();
carregarLog();
carregarNotas();
</script>
